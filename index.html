<title>Мусин дом</title>

<style>
:root{
  color-scheme:dark;
  --ink:#0d1210;
  --ink-2:#151c19;
  --moss:#232c27;
  --moss-2:#2f3a33;
  --fog:#98a19a;
  --paper:#d8d2c3;
  --muted:#7f8a83;
  --sakura:#eea3bb;
  --sakura-deep:#c9738f;
  --torii:#8e3a2c;
  --warn:#c26a5a;
  --line:rgba(216,210,195,.12);
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --ui:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
html,body{height:100%;}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;}
#app{height:100%;width:100%;min-width:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-inline:0;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
button:focus-visible{outline:2px solid var(--sakura);outline-offset:2px;border-radius:10px;}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;background:linear-gradient(var(--ink),rgba(13,18,16,.0));position:relative;z-index:3;}
.brand{display:flex;align-items:baseline;gap:6px;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1}
.brand i{font-style:normal;font-family:var(--jp);font-size:13px;color:var(--sakura);opacity:.8}
.coins{margin-left:auto;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mon{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9b86a,#8e6b2a);position:relative;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)}
.mon::after{content:"";position:absolute;inset:6px;background:var(--ink);border-radius:1px}
.coins span{font-size:18px;line-height:1}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;flex:none}
.needs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 16px 8px;position:relative;z-index:3}
.need{display:flex;flex-direction:column;gap:4px;min-width:0}
.need label{display:flex;justify-content:space-between;gap:4px;overflow:hidden;font-size:11px;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.need label em{font-style:normal;color:var(--paper);opacity:.85;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(216,210,195,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--fog);transition:width .6s ease, background .4s}
.need.low .bar i{background:var(--warn);animation:pulse 1.4s ease-in-out infinite}
.need.low label{color:var(--warn)}
@keyframes pulse{50%{opacity:.45}}

/* Stage */
.stage{flex:1;position:relative;min-height:0;margin:0 16px;border-radius:14px;overflow:hidden;background:#1a211d;box-shadow:0 0 0 1px var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.room-title{position:absolute;left:14px;top:10px;display:flex;align-items:baseline;gap:8px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.room-title b{font-family:var(--jp);font-weight:500;font-size:20px;color:var(--paper);opacity:.9}
.room-title span{font-family:var(--display);font-size:18px;font-weight:600;color:var(--fog)}
.hint{position:absolute;left:14px;right:14px;top:40px;font-size:12px;line-height:1.4;color:rgba(216,210,195,.6);pointer-events:none;text-shadow:0 1px 6px #000;max-width:30em;transition:opacity .6s}
.hint.off{opacity:0}
.toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:rgba(13,18,16,.85);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* Tray */
.tray{padding:10px 16px 6px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:6px}
.seg button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--paper);border-color:var(--paper)}
.items{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x proximity}
.items::-webkit-scrollbar{display:none}
.item{flex:none;width:84px;min-height:84px;border-radius:12px;background:var(--ink-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;scroll-snap-align:start;transition:transform .15s, border-color .2s}
.item:active{transform:scale(.95)}
.item .ico{font-size:26px;line-height:1;height:30px;display:grid;place-items:center}
.item .ico canvas{width:44px;height:30px}
.item .nm{font-size:11.5px;line-height:1.2;text-align:center;color:var(--paper)}
.item .pr{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.item .pr .mon{width:11px;height:11px}.item .pr .mon::after{inset:3.5px}
.item.on{border-color:var(--sakura);box-shadow:inset 0 0 0 1px var(--sakura)}
.item.on .pr{color:var(--sakura)}
.item.wide{width:132px}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--ink)}
.tabs button{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--muted);position:relative}
.tabs button b{font-family:var(--jp);font-weight:500;font-size:17px;line-height:1.1}
.tabs button span{font-size:10.5px;letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--paper)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;bottom:0;width:18px;height:2px;border-radius:2px;background:var(--sakura)}

/* Mini-game overlay */
.game{position:fixed;inset:0;z-index:20;background:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.game header{display:flex;align-items:center;gap:12px;padding:10px 16px}
.game header h2{font-family:var(--display);font-size:24px;font-weight:700;margin:0;flex:1;text-wrap:balance}
.game header .stat{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;white-space:nowrap}
.game .field{flex:1;position:relative;margin:0 16px 16px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.game canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,12,.72);backdrop-filter:blur(3px)}
.card{max-height:calc(100% - 32px);overflow-y:auto;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;width:min(320px,calc(100% - 32px));display:flex;flex-direction:column;gap:12px;text-align:center}
.card h3{font-family:var(--display);font-size:28px;margin:0}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.card .big{font-size:44px;font-weight:600;font-family:var(--display);color:var(--paper);line-height:1}
.card .row{display:flex;gap:8px}
.btn{flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gcard{border-radius:12px;background:var(--ink-2);border:1px solid var(--line);padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.gcard b{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.15}
.glist{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.glist h4{margin:2px 0 0;font-family:var(--display);font-size:16px;font-weight:600;color:var(--sakura);letter-spacing:.02em}
.card .tag{font-family:var(--jp);font-size:13px;color:var(--sakura);letter-spacing:.04em}
.card .lore{color:var(--paper);opacity:.85;text-align:left}
.card p b{color:var(--paper)}
.gcard span{font-size:11.5px;color:var(--muted);line-height:1.35}
.gcard em{font-style:normal;font-size:11px;color:var(--sakura);margin-top:2px}
.story{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 110%,rgba(200,130,60,.18),transparent 60%),#0b0f0d;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.story header{display:flex;align-items:center;gap:12px;padding:12px 16px}
.story h2{flex:1;margin:0;font-family:var(--display);font-size:26px;font-weight:700}
.story-body{flex:1;overflow-y:auto;padding:4px 16px 28px;max-width:40em;width:100%;margin:0 auto;box-sizing:border-box}
.story-body p{font-size:16px;line-height:1.65;margin:0 0 14px;color:var(--paper)}
.story-body h3{font-family:var(--display);font-size:30px;margin:10px 0 2px;text-wrap:balance}
.story-body .src{font-size:13px;color:var(--sakura);margin-bottom:18px}
.story-body .lead{color:var(--muted);font-size:14px}
.slist{display:grid;gap:8px}
.scard{text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.scard b{font-family:var(--display);font-size:20px}.scard span{font-size:12px;color:var(--muted)}
.story .back{color:var(--muted);font-size:13px;padding:6px 0}
.story .next{width:100%;margin-top:10px}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:50;font-family:var(--display);font-size:22px;color:var(--fog);transition:opacity .5s}
@media (max-width:380px){.needs{gap:6px}.need label{font-size:10px}.tabs button span{font-size:9.5px}.brand i{display:none}}
@media (prefers-reduced-motion:reduce){.need.low .bar i{animation:none}}
</style>

<div id="app">
  <header class="hud">
    <div class="brand"><b>Муся</b><i>猫の家</i></div>
    <div class="coins" title="Баланс бесконечный"><span class="mon"></span><span id="coinVal">∞</span></div>
    <button class="iconbtn" id="weatherBtn" aria-label="Погода" title="Погода: авто">🌦</button>
    <button class="iconbtn" id="scaryBtn" aria-label="Страшилки" title="Страшилки включены">👻</button>
    <button class="iconbtn" id="soundBtn" aria-label="Звук">🔈</button>
  </header>
  <div class="needs" id="needs"></div>
  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="room-title" id="roomTitle"></div>
    <div class="toast" id="toast"></div>
    <div class="hint" id="hint"></div>
  </main>
  <section class="tray" id="tray"></section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div>
<div class="game" id="game" hidden>
  <header><h2 id="gTitle"></h2><div class="stat" id="gStat"></div><button class="iconbtn" id="gClose" aria-label="Закрыть игру">✕</button></header>
  <div class="field" id="gField"><canvas id="gcv"></canvas><div class="result" id="gResult" hidden></div></div>
</div>
<div class="story" id="story" hidden><header><h2>Кайданы на ночь</h2><button class="iconbtn" id="storyClose" aria-label="Закрыть">✕</button></header><div class="story-body" id="storyBody"></div></div>
<div class="loading" id="loading">Муся просыпается…</div>

<script>
(()=>{
"use strict";
// ───────────────────────── Assets ─────────────────────────
const STRIPS=["rest","moveRight","moveLeft","sleep","play","purr","yarn","treat","highfive","stretch","groom","knead","house","butterfly","box","gift","hide","sulk","gaze9","gaze10"];
const ANCH={"rest":[[98,32.5],[86.2,35],[94.8,35],[96.8,34.5],[99,33],[97.8,36],[92.8,33],[98.8,31]],"moveRight":[[146.8,67],[149.8,70.5],[139.5,72],[143.5,71.5],[151.2,72],[146.8,77],[146.8,74],[144.8,77.5]],"moveLeft":[[75.5,63.5],[65.2,62],[67.2,67.5],[75.2,63.5],[69,64],[65.5,61.5],[69.5,65],[71,63.5]],"sleep":[[94,27.5],[102.2,39.5],[98.2,77],[101.8,102.5],[96,85.5],[98.8,91.5],[101.5,93],[105,92]],"play":[[99.2,58],[97.5,56.5],[105,63],[102,58.5],[118,55],[105.5,60.5],[104.8,53],[103,58.5]],"purr":[[97.5,33],[96.2,35],[94.8,37.5],[96.5,38],[101.2,36.5],[97,34.5],[91,35.5],[96.5,33.5]],"yarn":[[102,26.5],[116.8,29.5],[110,44],[119.8,47],[98.2,30],[96.8,21.5],[96.2,44],[132.2,36.5]],"treat":[[101.5,29.5],[100.2,30.5],[101,34],[102.8,30.5],[102.8,30.5],[102,30],[98.5,29.5],[99.5,27]],"highfive":[[98.5,36],[97.2,34.5],[106.2,30],[106.8,34],[103.5,31],[104,32],[97.8,33],[98,37]],"stretch":[[96.2,45.5],[89.5,53.5],[110,55.5],[136.8,19],[67.8,24.5],[100.2,36.5],[95.5,47],[95.2,45.5]],"groom":[[97.2,36],[102.5,36.5],[105.2,39.5],[101.5,39.5],[94.8,32],[97.8,34.5],[101.5,34.5],[100,40]],"knead":[[105,25.5],[98.2,32],[89.8,29.5],[103.2,26],[110.8,32.5],[101,38],[100.8,37.5],[104.8,34.5]],"house":[[103.5,65],[105,77],[113.5,58],[104,71.5],[105.2,81.5],[105.2,78.5],[105.2,70],[105.8,73]],"butterfly":[[103.2,56],[92,55.5],[107.8,108],[115.8,64.5],[113,30],[103,56.5],[92.5,112],[94.2,61]],"box":[[101.2,49],[127.5,46.5],[118.2,75],[113,67],[117.5,111],[137.8,95],[118.5,116],[108.5,78.5]],"gift":[[105,57],[100.2,59.5],[96,66.5],[117.2,61.5],[108.5,68.5],[119.2,74.5],[103.2,61],[102.5,49.5]],"hide":[[99,29],[99.8,29.5],[96,33],[98,36.5],[96,29.5],[103,31],[100.5,29.5],[101.2,28.5]],"sulk":[[94.2,26.5],[92.8,31],[104.5,29.5],[100.8,37],[115.2,26],[88,27.5],[102,29.5],[112,32]],"gaze9":[[97.8,33.5],[93.2,36],[93.8,38],[95.8,39.5],[111.5,44],[108,43],[107,44],[104.8,48.5]],"gaze10":[[94.5,47],[94,47.5],[91.8,48.5],[82.5,47.5],[89.8,51.5],[90.8,50.5],[92.5,47.5],[101.5,45.5]]};
const IMG={};
const BG_FILES=["engawa","kitchen","onsen","bedroom_on","bedroom_off","wardrobe","games","g_forest","g_temple","g_river","g_field","g_room"];
function loadImages(){
  const bgs=BG_FILES.map(n=>new Promise(res=>{const im=new Image();im.onload=()=>{BGI[n]=im;res();};im.onerror=()=>res();im.src="assets/bg/"+n+".webp";}));
  const decs=Object.keys(DMETA).map(n=>new Promise(res=>{const im=new Image();im.onload=()=>{DIMG[n]=im;res();};im.onerror=()=>res();im.src="assets/decor/"+n+".webp";}));
  return Promise.all([...bgs,...decs,...STRIPS.map(n=>new Promise(res=>{const im=new Image();im.onload=()=>{IMG[n]=im;res();};im.onerror=()=>res();im.src="assets/"+n+"@2x.webp";}))]);
}
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// ───────────────────────── Helpers ─────────────────────────
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*clamp(t,0,1);
const smooth=t=>{const u=clamp(t,0,1);return u*u*(3-2*u);};
const easeOutBack=t=>{const u=clamp(t,0,1)-1,c=1.9;return 1+(c+1)*u*u*u+c*u*u;};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const now=()=>performance.now()/1000;
function keyed(t,keys){if(t<=keys[0][0])return keys[0][1];for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(t<b[0])return mix(a[1],b[1],smooth((t-a[0])/(b[0]-a[0])));}return keys[keys.length-1][1];}
function gazeIndex(dx,dy){const ang=((Math.atan2(dx,dy)*180/Math.PI)+360)%360;return Math.round(ang/22.5)%16;}
const store={
  get(){try{return JSON.parse(localStorage.getItem("musya-jp-v1")||"null");}catch(e){return null;}},
  set(v){try{localStorage.setItem("musya-jp-v1",JSON.stringify(v));}catch(e){}}
};

// ───────────────────────── Sound ─────────────────────────
const snd={on:true,ctx:null,loops:{},cur:null};
function audioInit(){
  if(snd.ctx)return;
  try{snd.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  for(const n of ["purr","snore"]){const a=new Audio("assets/"+n+".wav");a.loop=true;a.volume=0;snd.loops[n]=a;}
}
function loop(name){
  if(!snd.on||!snd.ctx)name=null;
  if(snd.cur===name)return;
  for(const [n,a] of Object.entries(snd.loops)){if(n!==name){a.pause();a.currentTime=0;a.volume=0;}}
  snd.cur=name;
  if(name){const a=snd.loops[name];a.volume=0;a.play().catch(()=>{});const target=name==="purr"?0.45:0.3;let v=0;const iv=setInterval(()=>{v+=0.05;a.volume=Math.min(target,v);if(v>=target||snd.cur!==name)clearInterval(iv);},60);}
}
function sfx(kind){
  if(!snd.on||!snd.ctx)return;
  const c=snd.ctx,t=c.currentTime,g=c.createGain();g.connect(c.destination);
  const tone=(f1,f2,d,type="sine",vol=.12)=>{const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);const gg=c.createGain();gg.gain.setValueAtTime(vol,t);gg.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gg);gg.connect(c.destination);o.start(t);o.stop(t+d+.02);};
  if(kind==="pop")tone(520,980,.09,"sine",.1);
  else if(kind==="coin"){tone(1320,1320,.08,"triangle",.07);setTimeout(()=>tone(1760,1760,.14,"triangle",.07),70);}
  else if(kind==="chime"){tone(1046,1040,.9,"sine",.05);tone(1568,1560,1.1,"sine",.03);}
  else if(kind==="bad")tone(220,90,.28,"square",.05);
  else if(kind==="eat")tone(300,180,.08,"triangle",.08);

function extraFrame(a,t){

function pose(t){
  const a=pet.action,e=t-pet.start;
  const p={strip:"rest",frame:0,fade:true,sink:0,ledge:0,sway:0,breath:1};
  const set=(s,f)=>{p.strip=s;p.frame=f;};
  const lookAt=(cx,cy)=>{const g=gazeIndex(cx-97,cy-150);set(g<8?"gaze9":"gaze10",g%8);};
  const lookPointer=()=>{if(!pointer.known)return set("rest",0);const [cx,cy]=stageToCell(pointer.x,pointer.y);if(Math.hypot(cx-97,cy-150)<25)return set("rest",0);lookAt(cx,cy);};
  switch(a){
    case"idle":
      if(t<pet.gazeUntil&&pointer.known)lookPointer();else set("rest",idleFrame(t));break;
    case"cursor":
      if(pet.moving){set(pet.heading>0?"moveRight":"moveLeft",Math.floor(pet.walk)%8);p.fade=false;}else set("play",Math.floor(e*3.5)%8);break;
    case"purr":set("purr",Math.floor(e*1.8)%8);break;
    case"yarn":set("yarn",Math.floor(e*2.5)%8);break;
    case"sleep":if(e<2.8)set("sleep",Math.min(7,Math.floor(e/2.8*8)));else{set("sleep",7);p.breath=1+Math.sin(e*1.8)*.008;}break;
    case"treat":set("treat",e<.9?0:Math.min(7,Math.floor((e-.9)/3.5*8)));break;
    case"refuse":e<1.6?set(pet.variant%2?"gaze9":"gaze10",pet.variant%2?4:4):set("rest",1);break;
    case"peek":set("rest",e>=3.4&&e<3.6?4:(e>=3&&e<4.4?0:1));p.sink=peekDrop(e);p.ledge=clamp(Math.min(e/.3,(6.2-e)/.25),0,1);break;
    case"zoomies":if(pet.moving){set(pet.heading>0?"moveRight":"moveLeft",Math.floor(pet.walk)%8);p.fade=false;}else set("rest",0);break;
    case"highfive":{let i;if(e<1)i=Math.min(4,Math.floor(e*5));else if(e<2.4)i=Math.floor(e*3)%2===0?4:5;else i=Math.min(7,6+Math.floor((e-2.4)/.65));set("highfive",i);break;}
    case"poke":set("play",[0,3,3,5,5,1][Math.min(5,Math.floor(e/.28))]);break;
    case"washed":e<2?set("sulk",Math.min(3,Math.floor(e*2.5))):set("rest",e<2.6?1:0);break;
    case"stretch":case"groom":case"knead":case"house":case"butterfly":case"box":case"gift":case"hide":case"sulk":
      set(a,extraFrame(a,e));break;
    case"firefly":{const f=firefly(e);if(f){if(f.x>30&&f.x<125&&f.y<50&&f.settled>.1)set("play",f.settled<.35?2:3);else lookAt(f.x,f.y);}else set("rest",e<1?0:1);break;}
    case"petals":{const pp=petalPose(e);if(pp)set(pp[0],pp[1]);else{const list=petalsAt(e).filter(q=>!q.pop);if(list.length){const low=list.reduce((m,q)=>q.y<m.y?q:m);lookAt(low.x,low.y);}else set("rest",0);}break;}
    case"cucumber":
      if(e<2.2)set("gaze10",4);else if(e<2.8)set("gaze9",6);else if(e<3.8)set("play",4);else if(e<4.3)set("play",2);
      else if(e<5.3)set("sulk",Math.min(3,Math.floor((e-4.3)*4)));else if(e<6.8)set("sulk",4+Math.floor(e*1.6)%2);else set("sulk",Math.min(7,6+Math.floor((e-6.8)/.4)));break;
    case"meow":if((e>=.4&&e<1.3)||(e>=2.6&&e<3.4))set("stretch",5);else if((e>=2.2&&e<2.6)||e>=3.4)set("rest",1);else set("rest",0);break;
    case"music":{const act=e>.6&&e<9.3;set("rest",act?(Math.floor(e/2.6)%3===2?5:4):0);p.sway=4*Math.sin(e*2*Math.PI/1.3)*smooth(Math.min(e/.8,(10-e)/.8));break;}
    case"beg":
      if(e<1.2)lookPointer();else if(e<3.2)set("rest",1);else if(e<4)set("rest",idlePose("slow",(e-3.2)*1.5/.8));
      else if(e<4.8)set("highfive",Math.min(3,Math.floor((e-4)/.2)));else if(e<6.2)set("highfive",3);else if(e<6.8)set("highfive",Math.min(7,6+Math.floor((e-6.2)/.3)));
      else if(e<8.2)set("rest",1);else lookPointer();break;
    case"wash":set("rest",pet.foam.length>12?(Math.floor(t/1.4)%4===0?5:4):idleFrame(t));break;
  }
  return p;
}

function emit(sp,t,dur){
  const from=sp.from||0,to=sp.to||1e9;if(t<from||t>=to)return[];
  const local=t-from;let fade=Math.min(1,local/.35);if(dur)fade*=clamp((dur-t)/.6,0,1);if(to<1e9)fade*=clamp((to-t)/.3,0,1);

  for(let k=0;k<sp.count;k++){
    const sh=local+k/sp.count*sp.every,cyc=Math.floor(sh/sp.every),a=(sh%sp.every)/sp.every;
    const g=sp.g[(cyc+k)%sp.g.length],side=(cyc+k)%2===0?1:-1,seed=k*2.1+cyc*1.7;
    let x,y,al=Math.pow(Math.sin(Math.PI*a),.6),size=sp.size||16;
    switch(sp.style||"rise"){
      case"rise":x=h.x+side*(34+8*Math.sin(seed))+7*Math.sin(a*5+seed);y=h.y+18+56*(1-(1-a)*(1-a));size*=.8+.3*a;break;
      case"notes":x=h.x+side*36+12*Math.sin(a*6.3+seed);y=h.y+8+72*a;break;
      case"zzz":x=116+40*a+5*Math.sin(a*7+seed);y=86+66*a;size=11+12*a;al=Math.min(1,a*5)*(1-a);break;
      case"trail":x=pet.heading>0?46-50*a:146+50*a;y=22+12*a+5*Math.sin(seed);al=1-a;size*=.7+.5*a;break;
      case"burst":{const fr=(seed*.37)%1,ang=Math.PI*(.12+.76*fr),r=26+44*a;x=h.x+Math.cos(ang)*r;y=h.y+24+Math.sin(ang)*r*.7;al=Math.pow(1-a,.8);break;}
    }
    out.push({g,x,y,al:Math.max(0,al)*fade,size,letter:!!sp.letter});
  }
  return out;
}

function updateSakura(t,dt){
  if(t>sakura.next&&t>sakura.until){sakura.until=t+rand(9,15);sakura.next=sakura.until+rand(35,90);}
  if(t<sakura.until){sakura.acc+=dt*7;while(sakura.acc>1){sakura.acc--;const fromTop=Math.random()<.65;
    sakura.list.push({x:fromTop?rand(-view.W*.2,view.W*.9):-10,y:fromTop?-10:rand(0,view.H*.6),vx:rand(25,60),vy:rand(20,45),rot:rand(0,6),vr:rand(-2.5,2.5),size:rand(4,8)*Math.max(.8,view.s),ph:rand(0,6),life:30});}}
  for(const p of sakura.list){p.ph+=dt;p.x+=(p.vx+Math.sin(p.ph*1.7)*18)*dt;p.y+=p.vy*dt;if(p.vy<40)p.vy+=40*dt;p.rot+=p.vr*dt;p.life-=dt;}

// ───────────────────────── Update loop ─────────────────────────
let nextAuto=now()+rand(14,26),lastT=now(),lastHud=0;
function update(t,dt){
  const n=S.needs,sleeping=pet.action==="sleep";
  n.food=clamp(n.food-dt*2.2/60,0,100);n.clean=clamp(n.clean-dt*1.2/60,0,100);n.joy=clamp(n.joy-dt*(sleeping?.6:2.4)/60,0,100);
  n.energy=clamp(n.energy+dt*(sleeping?(S.lampOff?30:14):-1.6)/60,0,100);
  if(pet.action==="purr")n.joy=clamp(n.joy+dt*3,0,100);
  const e=t-pet.start,d=DUR[pet.action];
  if(d&&e>=d)start("idle",true);
  if(pet.action==="sleep"&&pet.napUntil&&t>pet.napUntil)start("stretch",true);
  if(pet.action==="sleep"&&S.room==="bedroom"&&!S.lampOff&&!pet.napUntil&&e>1)start("stretch",true);
  // she lives her own life when left alone
  if(pet.action==="idle"&&t>nextAuto&&!drag.active){
    let a;if(n.energy<28)a="sleep";else if(n.joy<40||n.food<30)a="beg";else if(n.clean<30)a="groom";
    else a=pick(["groom","stretch","knead","hide","meow","music","peek","yarn","butterfly","box","beg","sleep","petals","firefly"]);
    start(a,true);if(a==="sleep")pet.napUntil=t+rand(30,60);
  }
  // movement
  pet.moving=false;pet.lift=0;const s=view.s,minX=96*s,maxX=view.W-96*s;
  if(pet.action==="cursor"&&pointer.known){const dx=pointer.x-pet.x;if(Math.abs(dx)>90*s){const want=pointer.x-Math.sign(dx)*80*s,step=Math.sign(want-pet.x)*Math.min(Math.abs(want-pet.x),230*s*dt);if(Math.abs(step)>.3){pet.x=clamp(pet.x+step,minX,maxX);pet.walk+=Math.abs(step)/(26*s);pet.heading=Math.sign(dx);pet.moving=true;}}}
  if(pet.action==="zoomies"){const seg=clamp(view.W/(520*s),1,1.8),pts=[pet.home,maxX,minX,maxX,pet.home];if(e<seg*4){const i=Math.min(3,Math.floor(e/seg)),u=(e-i*seg)/seg,x=mix(pts[i],pts[i+1],u+(smooth(u)-u)*.65);const dx=x-pet.x;if(Math.abs(dx)>.2)pet.heading=Math.sign(dx);pet.walk+=Math.abs(dx)/(30*s);pet.x=x;pet.moving=true;}}

  if(pet.action==="cucumber")pet.lift=cucumberJump(e)*s;
  loop(pet.action==="purr"?"purr":pet.action==="sleep"&&e>2.8?"snore":null);

  for(const d of pet.drops){d.y+=d.vy*dt;d.vy+=500*dt;d.a-=dt*.8;}pet.drops=pet.drops.filter(d=>d.a>0&&d.y<view.H);
  if(pet.rinsing){for(const f of pet.foam)f.a-=dt*.9;pet.foam=pet.foam.filter(f=>f.a>0);if(!pet.foam.length)pet.rinsing=false;}
  updateSakura(t,dt);updateWeather(t,dt);updateSpook(t);
}
function frame(){
  const t=now(),dt=Math.min(.05,t-lastT);lastT=t;
  update(t,dt);render(t,dt);
  if(t-lastHud>.25){lastHud=t;hudTick();}
  requestAnimationFrame(frame);
}

const drag={active:false,mode:null,sx:0,sy:0,px:0,py:0,dist:0,startX:0,lastTap:0,tapTimer:null};
function hitCat(x,y){const [cx,cy]=stageToCell(x,y);return cx>28&&cx<168&&cy>10&&cy<205;}

});
function endDrag(ev){
  if(!drag.active)return;drag.active=false;const [x,y]=local(ev);
  if(drag.mode==="cat"&&drag.dist>8){react("😽",1.6);return;}
  if(drag.mode==="soap"){pet.start=now()-DUR.washed+0.1;pet.action="wash";return;}
  if(drag.dist>8)return;
  if(drag.mode==="cat"||drag.mode==="pet"){
    const t=now();

// ───────────────────────── Weather: rain and thunder ─────────────────────────
const weather={on:false,until:0,next:now()+rand(60,160),drops:[],splash:[],flash:-9,thunderAt:0,nextBolt:0,noise:null,gain:null};
const RAIN_REGION={engawa:[[64,112,1380,1118],"garden"],onsen:[[0,0,1800,1400],"out"],games:[[0,0,1800,1400],"out"],kitchen:[[240,180,820,640],"window"]};
function rainSound(on,loud){
  if(!snd.ctx)return;const c=snd.ctx;
  if(on&&snd.on){if(!weather.noise){const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3+(Math.random()*2-1)*.25;}
      const s=c.createBufferSource();s.buffer=b;s.loop=true;const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=2400;const g=c.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(c.destination);s.start();weather.noise=s;weather.gain=g;}
    weather.gain.gain.setTargetAtTime(loud?.22:.1,c.currentTime,.8);}
  else if(weather.gain){weather.gain.gain.setTargetAtTime(0,c.currentTime,.6);}
}
function thunder(){if(!snd.on||!snd.ctx)return;const c=snd.ctx,t=c.currentTime,b=c.createBuffer(1,c.sampleRate*3,c.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){last=(last+.03*(Math.random()*2-1))/1.03;d[i]=last*6*Math.pow(1-i/d.length,1.4)*(i<c.sampleRate*.15?i/(c.sampleRate*.15):1);}
  const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=260;const g=c.createGain();g.gain.value=.9;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);}
function updateWeather(t,dt){
  const mode=S.weather;
  if(mode==="rain")weather.on=true;else if(mode==="clear")weather.on=false;
  else{if(!weather.on&&t>weather.next){weather.on=true;weather.until=t+rand(80,200);}if(weather.on&&t>weather.until){weather.on=false;weather.next=t+rand(120,300);}}
  const reg=RAIN_REGION[S.room];rainSound(weather.on,!!reg&&reg[1]!=="window");
  if(weather.on){if(!weather.nextBolt)weather.nextBolt=t+rand(8,20);if(t>weather.nextBolt){weather.flash=t;weather.thunderAt=t+rand(.5,1.6);weather.nextBolt=t+rand(14,40);if(pet.action!=="sleep"){react("🙀",1.6);if(pet.action==="idle")start("hide",true);}}}
  else weather.nextBolt=0;
  if(weather.thunderAt&&t>weather.thunderAt){weather.thunderAt=0;thunder();}
  const want=weather.on&&reg?(reg[1]==="window"?60:170):0;
  while(weather.drops.length<want)weather.drops.push({u:Math.random(),v:Math.random(),sp:rand(.9,1.4),len:rand(.7,1.3)});
  if(weather.drops.length>want)weather.drops.length=want;
  for(const d of weather.drops){d.v+=dt*d.sp*(reg&&reg[1]==="window"?1.1:.8);if(d.v>1){d.v-=1+Math.random()*.2;d.u=Math.random();if(reg&&reg[1]!=="window"&&Math.random()<.5)weather.splash.push({u:d.u,t});}}
  weather.splash=weather.splash.filter(s=>t-s.t<.35);
}
function drawRain(t,front){
  const reg=RAIN_REGION[S.room];
  if(weather.on&&!front){ctx.fillStyle="rgba(10,16,22,.16)";ctx.fillRect(0,0,view.W,view.H);}
  if(!weather.on||!reg)return;const isFront=reg[1]==="out";if(front!==isFront)return;
  const [x0,y0,x1,y1]=reg[0],[sx0,sy0]=imgToStage(x0,y0),[sx1,sy1]=imgToStage(x1,y1),w=sx1-sx0,h=sy1-sy0,s=view.s;

  for(const d of weather.drops){const x=sx0+d.u*w+d.v*18*s,y=sy0+d.v*h,L=(reg[1]==="window"?10:22)*s*d.len;ctx.moveTo(x,y);ctx.lineTo(x-4*s,y-L);}ctx.stroke();
  ctx.strokeStyle="rgba(200,210,215,.35)";for(const p of weather.splash){const a=(t-p.t)/.35,x=sx0+p.u*w,y=sy1-6*s-(p.u*37%1)*(reg[1]==="garden"?10:60)*s;ctx.beginPath();ctx.ellipse(x,y,(2+10*a)*s,(1+3*a)*s,0,0,Math.PI*2);ctx.globalAlpha=1-a;ctx.stroke();}

    case"shadow":case"shadow_bed":{const box=ev.kind==="shadow"?[1400,124,1792,1100]:[640,150,1560,1000],[bx0,by0]=imgToStage(box[0],box[1]),[bx1,by1]=imgToStage(box[2],box[3]);
      const u=ev.kind==="shadow"?e/ev.dur:.5+Math.sin(e*.7)*.08,hh=(by1-by0)*.95,ww=hh*.5;
      const c=silhouette(g=>drawYurei(g,ww/2,0,hh,1,false,false),ww,hh);ctx.save();ctx.beginPath();ctx.rect(bx0,by0,bx1-bx0,by1-by0);ctx.clip();ctx.globalAlpha=.55*fade;ctx.filter="blur(2px)";ctx.drawImage(c,mix(bx0-ww,bx1,u),by1-hh);ctx.restore();break;}
    case"hands":{const [bx0,by0]=imgToStage(640,150),[bx1,by1]=imgToStage(1560,1000),n=Math.min(7,Math.floor(e*2.2));const rr=rng(ev.seed|0);
      ctx.save();ctx.globalAlpha=.6*fade;ctx.fillStyle="#1a0e0c";for(let i=0;i<n;i++){const x=mix(bx0,bx1,.1+rr()*.8),y=mix(by0,by1,.15+rr()*.7),r=13*s,a=rr()*.6-.3;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(0,0,r,r*1.15,0,0,Math.PI*2);ctx.fill();
        for(let f=0;f<5;f++){const fa=-Math.PI/2+(f-2)*.32+(f===0?-.5:0),fl=r*(f===0?1.1:f===2?1.9:1.6);ctx.beginPath();ctx.ellipse(Math.cos(fa)*fl*.9,Math.sin(fa)*fl*.9,r*.24,fl*.5,fa+Math.PI/2,0,Math.PI*2);ctx.fill();}ctx.restore();}ctx.restore();break;}
    case"kitsunebi":{for(let i=0;i<3;i++){const [x,y]=imgToStage(mix(-100,1900,(e/ev.dur+i*.12)%1),860+Math.sin(e*2+i)*40+i*30);const gr=ctx.createRadialGradient(x,y,0,x,y,26*s);gr.addColorStop(0,`rgba(140,200,255,${.8*fade})`);gr.addColorStop(1,"rgba(80,140,220,0)");ctx.fillStyle=gr;ctx.fillRect(x-26*s,y-26*s,52*s,52*s);}break;}
    case"hair":{const [x,y]=imgToStage(700+ev.x*400,1060);ctx.save();ctx.globalAlpha=.8*fade;ctx.strokeStyle="#060606";ctx.lineWidth=1.4;for(let i=0;i<40;i++){ctx.beginPath();ctx.moveTo(x,y);for(let j=1;j<8;j++)ctx.lineTo(x+Math.cos(i*.16)*j*12*s+Math.sin(e*2+j+i)*4*s,y+Math.sin(i*.16)*j*3*s);ctx.stroke();}ctx.restore();break;}
    case"obake":{const [x,y]=imgToStage(1560,300),r=62*BGM.k;ctx.save();ctx.globalAlpha=fade;ctx.fillStyle="#f4efe2";ctx.beginPath();ctx.ellipse(x+r*.1,y-r*.35,r*.42,r*.3*Math.min(1,e*2),0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#140a08";ctx.beginPath();ctx.arc(x+r*.1+Math.sin(e*1.5)*r*.15,y-r*.35,r*.14,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#1a0806";ctx.beginPath();ctx.ellipse(x,y+r*.45,r*.5,r*.14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#c23a3a";ctx.beginPath();ctx.moveTo(x-r*.12,y+r*.5);ctx.quadraticCurveTo(x+r*.1,y+r*(1.4+.3*Math.sin(e*4)),x+r*.25,y+r*.5);ctx.fill();ctx.restore();break;}
    case"flicker":{const on=[.05,.15,.3,.42,.62,.7].some((v,i)=>e>v&&e<v+.07+(i%2)*.05);if(on){ctx.fillStyle="rgba(2,3,5,.78)";ctx.fillRect(0,0,view.W,view.H);}break;}
  }

const KAIDAN=[
 {t:"Безликая у рва",src:"«Мудзина», Лафкадио Хирн, «Кайдан», 1904",p:["В Токио есть склон Кии-но-куни-дзака. С одной его стороны — старый глубокий ров, с другой — высокие стены княжеской усадьбы. В те времена, когда ещё не было уличных фонарей, после заката здесь старались не ходить.","Однажды поздно вечером по склону торопился купец и увидел у рва девушку. Она сидела одна и горько плакала, закрыв лицо рукавом. Купец испугался, что она задумала броситься в воду, и заговорил с ней ласково: «Не плачьте, расскажите, что случилось». Девушка всхлипывала и не отвечала. Он тронул её за плечо.","Тогда она опустила рукав и медленно повернулась. У неё не было лица: ни глаз, ни носа, ни рта — только гладкая кожа, как яичная скорлупа.","Купец с криком бросился бежать и бежал, пока не увидел огонёк. Это был фонарь ночного продавца лапши. «Там… у рва… девушка… у неё лицо…» — задыхался купец. «Вот такое?» — спросил продавец и провёл ладонью по своему лицу. Оно стало гладким, как яйцо. И фонарь погас."]},
 {t:"Хоити Безухий",src:"«Мими-наси Хоити», Лафкадио Хирн, «Кайдан», 1904",p:["Слепой монах Хоити лучше всех пел под бива «Повесть о доме Тайра» — о морской битве при Дан-но-ура, где погиб весь род Тайра вместе с малолетним императором. Жил он в храме Амидадзи у самого моря.","Однажды ночью за ним пришёл самурай: «Мой господин желает тебя послушать». Он вёл Хоити через ворота, по камням, в зал, полный шелеста шёлка и шёпота. Хоити пел — и слышал, как невидимые слушатели рыдают. Так было каждую ночь, и Хоити слабел.","Слуги храма проследили за ним и нашли его одного под дождём, на кладбище Тайра: он пел среди могил, а вокруг горели блуждающие огни. Настоятель понял, что мёртвые не отпустят певца. Он исписал всё тело Хоити священной сутрой и велел сидеть неподвижно и молчать.","Ночью самурай звал его, но видел пустоту. Только в темноте висели два уха — их забыли покрыть письменами. «Отнесу господину хоть это», — сказал голос, и уши оторвали. Хоити выжил. С тех пор его зовут Хоити Безухий."]},
 {t:"Снежная женщина",src:"«Юки-онна», Лафкадио Хирн, «Кайдан», 1904",p:["Старый дровосек Мосаку и юный Минокити возвращались из леса, когда началась метель. Лодочник уже ушёл, и они укрылись в его хижине у реки. Ночью Минокити проснулся от снега на лице: дверь была открыта, а над Мосаку склонилась женщина в белом. Она дохнула на старика — и его дыхание стало белым дымом.","Потом она наклонилась к Минокити. Лицо её было прекрасным, а глаза — страшными. «Ты молод, я тебя пощажу, — сказала она. — Но если расскажешь кому-нибудь о том, что видел, я узнаю. И тогда убью тебя». Утром Мосаку нашли замёрзшим.","Через год Минокити встретил на дороге девушку О-Юки. Они поженились, у них родилось десять детей, а О-Юки совсем не старела. Однажды вечером, глядя на неё при свете лампы, Минокити сказал: «Ты напоминаешь мне одну женщину…» — и рассказал о той ночи.","О-Юки поднялась: «Это была я! Я обещала убить тебя, если скажешь хоть слово. Только ради детей ты жив». Её голос стал тонким, как вой ветра, и она растаяла белым туманом. Больше её никто не видел."]},
 {t:"Тарелки Окику",src:"«Банчо Сараясики», легенда эпохи Эдо",p:["В доме самурая Аоямы служила девушка Окику. Ей доверили беречь десять драгоценных тарелок фамильного сервиза. Однажды одна тарелка исчезла — по одной версии, её спрятал сам хозяин, по другой — завистливый слуга.","Сколько бы Окику ни пересчитывала, тарелок было девять. Её обвинили в пропаже и бросили в старый колодец в саду.","С тех пор каждую ночь из колодца доносится тихий голос: «Одна… две… три… четыре…» — и так до девяти. А после девятой тарелки раздаётся крик, от которого слышавшие его заболевали.","Говорят, Окику затихла, лишь когда смельчак крикнул в колодец: «Десять!». Колодец Окику до сих пор показывают в замке Химэдзи."]},
 {t:"Лицо в фонаре",src:"«Ёцуя-кайдан», пьеса кабуки Цуруи Намбоку IV, 1825",p:["Ронин Тамия Иэмон был женат на кроткой О-Иве, но захотел жениться на богатой соседке. Её семья прислала О-Иве «лекарство» — на самом деле яд. Волосы О-Ивы стали выпадать клоками, один глаз опух и закрылся. Увидев себя в зеркале, она поняла, что её предали, и умерла, проклиная мужа.","Иэмон женился на богатой невесте. Но в первую же ночь он поднял покрывало — и увидел изуродованное лицо О-Ивы. Он выхватил меч и ударил — а на полу лежала его невеста.","С тех пор лицо О-Ивы смотрело на Иэмона из бумажных фонарей, выплывало из дыма, шептало из воды. Он потерял рассудок.","Эту историю считают самым страшным японским кайданом. Актёры до сих пор перед постановкой приходят к святилищу О-Ивы в Ёцуе просить прощения — говорят, иначе беды не миновать."]},
 {t:"Летающие головы",src:"«Рокурокуби», Лафкадио Хирн, «Кайдан», 1904",p:["Монах Кайрё, в прошлом храбрый самурай, странствовал по горам провинции Каи. Лесоруб пригласил его переночевать в хижине, где жили ещё четверо. Все были очень учтивы.","Ночью Кайрё вышел попить воды и увидел в комнате пять тел — без голов. Ран на шеях не было: головы просто отделились. Монах понял, что это рокурокуби — существа, чьи головы по ночам улетают охотиться. А если спрятать тело, голова не сможет вернуться.","Он вытащил тело хозяина наружу. Из леса донеслись голоса: головы летали среди деревьев, ловили насекомых и спорили, как бы съесть толстого монаха. Когда они нашли Кайрё, началась битва. Монах отбивался молодым деревцем, пока головы не пали. Лишь голова хозяина вцепилась зубами в его рукав и так и умерла.","Кайрё продолжил путь с головой, висящей на рукаве. В соседней деревне его чуть не схватили как убийцу, пока судья не разглядел на шее головы красные знаки — метки рокурокуби."]},
 {t:"Кошка из Набэсимы",src:"Легенда эпохи Эдо о княжеском роде Набэсима",p:["Князь Набэсима из Хидзэна любил красавицу О-Тоё. Однажды ночью в её покои пробралась огромная кошка-оборотень. Она погубила девушку и приняла её облик.","С тех пор князь начал чахнуть. Каждую ночь его мучили кошмары, и никакие лекари не помогали. Сотня стражников дежурила у его постели, но к полуночи всех их одолевал непреодолимый сон.","Молодой воин Ито Сода вызвался сторожить. Когда накатила сонливость, он вонзил нож себе в бедро, чтобы боль не давала уснуть. В полночь дверь бесшумно открылась, и вошла «О-Тоё». Увидев неспящего Ито, она отступила. Так было несколько ночей, и князь начал поправляться.","Тогда Ито пришёл к «О-Тоё» с копьём. Она прыгнула на крышу и обернулась огромной кошкой. Её загнали в горы, и князь выздоровел. Муся уверяет, что эта история не про неё."]},
 {t:"Женщина в маске",src:"Городская легенда, паника 1979 года",p:["Весной 1979 года по японским школам поползли слухи: в сумерках к одиноким прохожим подходит высокая женщина в длинном плаще и марлевой маске. Она спрашивает: «Я красивая?»","Если ответить «нет» — беда. Если сказать «да», она медленно снимет маску: её рот разрезан от уха до уха. «А теперь?» — спросит она. Бежать бесполезно: она всегда оказывается впереди.","Говорили, что спастись можно, ответив «так себе», бросив ей леденцы бэккоамэ или трижды сказав слово «помада». Слухи были такими сильными, что в некоторых городах учителя провожали детей домой группами.","Похожие рассказы находят ещё в эпоху Эдо: там это была лиса-оборотень, прикидывающаяся красавицей."]}
];
function openStory(i){
  const st=$("story"),body=$("storyBody");st.hidden=false;
  if(i==null){body.innerHTML=`<p class="lead">Страшные истории Японии в пересказе. Муся слушает из-под одеяла.</p><div class="slist">${KAIDAN.map((k,j)=>`<button class="scard" data-story-i="${j}"><b>${k.t}</b><span>${k.src}</span></button>`).join("")}</div>`;}
  else{const k=KAIDAN[i];body.innerHTML=`<button class="back" data-story-i="-1">← Все истории</button><h3>${k.t}</h3><p class="src">${k.src}</p>${k.p.map(x=>`<p>${x}</p>`).join("")}<button class="btn primary next" data-story-i="${(i+1)%KAIDAN.length}">Следующая история</button>`;body.scrollTop=0;tone(70,1.2,"sawtooth",.04);}
  if(pet.action!=="sleep")start("hide");
}

const G={id:null,def:null,st:{},raf:0,cv:$("gcv"),ctx:null,W:0,H:0,s:1,score:0,lives:3,time:null,over:false,running:false,last:0,scareT:-9,scareKind:"yurei",held:false,bgc:null};

function tone(freq,d=.35,type="sine",vol=.08){if(!snd.on||!snd.ctx)return;const c=snd.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);}
function scare(t,kind="yurei"){G.scareT=t;G.scareKind=kind;if(!snd.on||!snd.ctx)return;const c=snd.ctx,n=c.currentTime,b=c.createBuffer(1,c.sampleRate*.6,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=900;const g=c.createGain();g.gain.value=.35;s.connect(f);f.connect(g);g.connect(c.destination);s.start(n);tone(70,.6,"sawtooth",.09);}
function hurt(t,kind){G.lives--;scare(t,kind);}

function btnRect(g,x,y,w,h,label,hot){g.save();g.fillStyle=hot?"rgba(216,210,195,.95)":"rgba(16,21,19,.88)";g.strokeStyle="rgba(216,210,195,.35)";g.beginPath();g.roundRect(x,y,w,h,12);g.fill();g.stroke();textC(g,label,x+w/2,y+h/2,Math.min(16,h*.38),hot?"#0d1210":"#d8d2c3");g.restore();}
// Yūrei: white kimono without feet, long black hair. Back view hides the face.
function drawYurei(g,x,top,h,alpha,front,eyesRed){
  g.save();g.globalAlpha=alpha;const w=h*.42;
  const body=g.createLinearGradient(0,top+h*.2,0,top+h);body.addColorStop(0,"rgba(228,230,226,.95)");body.addColorStop(1,"rgba(228,230,226,0)");
  g.fillStyle=body;g.beginPath();g.moveTo(x-w*.28,top+h*.22);g.quadraticCurveTo(x-w*.7,top+h*.6,x-w*.45,top+h);g.lineTo(x+w*.45,top+h);g.quadraticCurveTo(x+w*.7,top+h*.6,x+w*.28,top+h*.22);g.fill();
  g.strokeStyle="rgba(150,150,150,.35)";g.lineWidth=h*.008;g.beginPath();g.moveTo(x-w*.12,top+h*.24);g.lineTo(x+w*.08,top+h*.5);g.stroke();
  g.fillStyle="rgba(228,230,226,.9)";for(const sd of[-1,1]){g.beginPath();g.moveTo(x+sd*w*.3,top+h*.26);g.quadraticCurveTo(x+sd*w*.62,top+h*.36,x+sd*w*.5,top+h*.52);g.lineTo(x+sd*w*.3,top+h*.44);g.fill();
    g.fillStyle="rgba(200,200,196,.9)";g.beginPath();g.ellipse(x+sd*w*.46,top+h*.52,w*.05,w*.1,0,0,Math.PI*2);g.fill();g.fillStyle="rgba(228,230,226,.9)";}

   S.items=S.items.filter(i=>t-i.t<2.6&&!i.got);
   if(!S.parade&&t>S.nextParade){S.parade={t0:t,warn:1.3,dur:2.8,hit:false};}
   if(S.parade){const p=S.parade,e=t-p.t0;if(e<p.warn&&Math.floor(e*6)!==p.beat){p.beat=Math.floor(e*6);tone(65,.14,"triangle",.14);}
     if(e>p.warn&&e<p.warn+p.dur&&!S.hide&&!p.hit){p.hit=true;hurt(t,"oni");}
     if(e>p.warn+p.dur){S.parade=null;S.nextParade=t+Math.max(2.4,rand(3.5,6.5)-el*.04);}}},
 draw(G,g,t){const S=G.st,s=G.s,W=G.W,H=G.H,p=S.parade,e=p?t-p.t0:0;
   for(const i of S.items){const a=(t-i.t)/2.6;drawEmoji(g,"🍙",i.x,i.y,28*s,Math.min(1,(1-a)*3));}
   if(p){if(e<p.warn){g.fillStyle=`rgba(120,0,0,${.12*Math.abs(Math.sin(e*18))})`;g.fillRect(0,0,W,H);textC(g,"Барабаны!",W/2,H*.12,20*s,"#c26a5a","italic 700");}
     else{const u=(e-p.warn)/p.dur;g.fillStyle="rgba(0,0,0,.45)";g.fillRect(0,0,W,H);const row=["🏮","👹","☂️","👺","🦊","💀","👻","🏮","👹","🐍"];
       row.forEach((m,i)=>{const x=mix(-W*.9,W*1.1,u)+i*44*s,y=H*.48+Math.sin(t*5+i)*8*s;const gr=g.createRadialGradient(x,y,0,x,y,40*s);gr.addColorStop(0,"rgba(200,60,40,.25)");gr.addColorStop(1,"rgba(200,60,40,0)");g.fillStyle=gr;g.fillRect(x-40*s,y-40*s,80*s,80*s);drawEmoji(g,m,x,y,34*s);});}}
   const lx=W*.2,ly=H-16*s;drawCatG(g,S.hide?"hide":"rest",S.hide?3:0,lx,S.hide?ly+30*s:ly,.46*s);
   g.fillStyle="#3a3f3b";g.fillRect(lx+30*s,ly-70*s,44*s,70*s);g.fillStyle="#454b47";g.beginPath();g.moveTo(lx+18*s,ly-70*s);g.lineTo(lx+52*s,ly-94*s);g.lineTo(lx+86*s,ly-70*s);g.fill();
   const b=this.btn(G);g.fillStyle=S.hide?"rgba(238,163,187,.9)":"rgba(16,21,19,.9)";g.strokeStyle="rgba(216,210,195,.4)";g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fill();g.stroke();textC(g,"Спрятаться",b.x,b.y,11*s,S.hide?"#0d1210":"#d8d2c3",700);},
 down(G,x,y,t){const S=G.st,b=this.btn(G);if(Math.hypot(x-b.x,y-b.y)<b.r+6){S.hide=true;return;}
   if(S.hide)return;const it=S.items.find(i=>Math.hypot(i.x-x,i.y-y)<30*G.s);if(it){it.got=1;G.score++;sfx("coin");}},
 up(G){G.st.hide=false;},
 stat:G=>`🍙 ${G.score}${hearts()} · ${Math.ceil(Math.max(0,G.time))} с`},

{id:"fish",n:"Рыбалка",tag:"Спокойная",bg:"pond",lives:3,time:45,icon:"🐟",lore:"Туманный пруд у храма. Рыба сама прыгает в лапы — только огурцы не лови.",how:"Води пальцем — Муся бегает. Рыба и суши — очки, огурец — минус жизнь.",
 init(G){const S=G.st;S.x=G.W/2;S.tx=G.W/2;S.items=[];S.spawn=0;S.walk=0;S.jump=0;},
 step(G,t,dt){const S=G.st,s=G.s,cs=.8*s,floor=G.H-30*s,dx=S.tx-S.x;S.moving=Math.abs(dx)>6;if(S.moving){const st=Math.sign(dx)*Math.min(Math.abs(dx),520*s*dt);S.x=clamp(S.x+st,80*cs,G.W-80*cs);S.walk+=Math.abs(st)/(22*s);S.head=Math.sign(dx);}
   S.spawn-=dt;if(S.spawn<=0){const el=45-G.time;S.spawn=Math.max(.38,.9-el*.012);const r=Math.random();S.items.push({x:rand(30,G.W-30),y:-20,vy:(150+el*4)*s,k:r<.2?"🥒":r<.3?"🍣":"🐟",rot:rand(-.4,.4)});}
   S.jump=Math.max(0,S.jump-dt);const lift=S.jump>0?Math.sin(Math.PI*(S.jump/.7))*70*s:0;S.lift=lift;
   for(const it of S.items){it.y+=it.vy*dt;const hy=floor-lift-150*cs;if(!it.done&&Math.abs(it.y-hy)<24*s&&Math.abs(it.x-S.x)<60*cs){it.done=1;if(it.k==="🥒"){G.lives--;S.jump=.7;sfx("bad");S.face=["🙀",t];}else{G.score+=it.k==="🍣"?3:1;sfx("coin");S.face=["😋",t];}}}
   S.items=S.items.filter(it=>!it.done&&it.y<G.H+30);},
 draw(G,g,t){const S=G.st,s=G.s,cs=.8*s,floor=G.H-30*s;for(const it of S.items){g.save();g.translate(it.x,it.y);g.rotate(it.rot);drawEmoji(g,it.k,0,0,30*s);g.restore();}
   if(S.jump>0)drawCatG(g,"play",4,S.x,floor-S.lift,cs);else if(S.moving)drawCatG(g,S.head>0?"moveRight":"moveLeft",Math.floor(S.walk)%8,S.x,floor,cs);else drawCatG(g,"rest",0,S.x,floor,cs);
   if(S.face&&t-S.face[1]<.9)drawEmoji(g,S.face[0],S.x+40*cs,floor-S.lift-220*cs,26*s,1-(t-S.face[1])/.9);},
 down(G,x){G.st.tx=x;},move(G,x,y,held){G.st.tx=x;},
 stat:G=>`🐟 ${G.score}${hearts()} · ${Math.ceil(Math.max(0,G.time))} с`},

{id:"fire",n:"Светлячки",tag:"Спокойная",bg:"forest",lives:null,time:30,icon:"✨",lore:"Летом в Японии любуются светлячками — хотару. Говорят, это души, вернувшиеся на землю.",how:"Лови светлячков касанием. Розовый огонёк сакуры — три очка.",
 init(G){G.st.items=[];G.st.spawn=0;G.st.sparks=[];},
 step(G,t,dt){const S=G.st;S.spawn-=dt;if(S.spawn<=0&&S.items.length<8){S.spawn=rand(.35,.7);S.items.push({x:rand(30,G.W-30),y:rand(40,G.H*.7),born:t,life:rand(2.2,3.2),ph:rand(0,6),pink:Math.random()<.12});}
   for(const f of S.items){f.x+=Math.sin(t*1.3+f.ph)*20*dt;f.y+=Math.cos(t*1.1+f.ph)*14*dt;}S.items=S.items.filter(f=>t-f.born<f.life&&!f.hit);},
 draw(G,g,t){const S=G.st,s=G.s;for(const f of S.items){const a=(t-f.born)/f.life,al=Math.sin(Math.PI*a)*(.7+.3*Math.sin(t*8+f.ph));if(f.pink)drawPetal(g,f.x,f.y,9*s,t+f.ph,al);const col=f.pink?"238,163,187":"214,242,122";const gr=g.createRadialGradient(f.x,f.y,0,f.x,f.y,20*s);gr.addColorStop(0,`rgba(${col},${.7*al})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(f.x-20*s,f.y-20*s,40*s,40*s);if(!f.pink){g.fillStyle=`rgba(245,255,210,${al})`;g.beginPath();g.arc(f.x,f.y,2.6*s,0,Math.PI*2);g.fill();}}
   for(const sp of S.sparks){const a=(t-sp.t)/.5;if(a<1)drawEmoji(g,sp.pink?"🌸":"✨",sp.x,sp.y-a*20*s,16*s,1-a);}
   const floor=G.H-18*s,cs=.7*s,tg=S.items[S.items.length-1];let st="rest",fi=0;if(tg){const gi=gazeIndex(tg.x-G.W/2,(floor-150*cs)-tg.y);st=gi<8?"gaze9":"gaze10";fi=gi%8;}if(S.pounce&&t-S.pounce<.4){st="play";fi=4;}drawCatG(g,st,fi,G.W/2,floor,cs);},
 down(G,x,y,t){const S=G.st,f=S.items.find(f=>Math.hypot(f.x-x,f.y-y)<30*G.s);if(f){f.hit=1;G.score+=f.pink?3:1;sfx(f.pink?"chime":"pop");S.sparks.push({x:f.x,y:f.y,t,pink:f.pink});S.pounce=t;}},
 stat:G=>`✨ ${G.score} · ${Math.ceil(Math.max(0,G.time))} с`},

{id:"mice",n:"Мыши у фонарей",tag:"Спокойная",bg:"temple",lives:null,time:30,icon:"🐭",lore:"У каменных фонарей-торо в храмовом саду вечно шуршат мыши. Муся на посту.",how:"Хватай мышей, пока не спрятались. Золотистый хомяк — три очка.",
 init(G){G.st.mice=LANTERNS.map(()=>({up:0,until:0,gold:false,hit:0}));G.st.spawn=0;},
 step(G,t,dt){const S=G.st,el=30-G.time,stay=Math.max(.55,1.1-el*.018);S.spawn-=dt;if(S.spawn<=0){S.spawn=rand(.35,.75);const free=S.mice.filter(m=>m.until<t&&m.up<=.05);if(free.length){const m=pick(free);m.until=t+stay;m.gold=Math.random()<.14;m.hit=0;}}
   for(const m of S.mice){const tg=m.until>t&&!m.hit?1:0;m.up+=(tg-m.up)*Math.min(1,dt*12);}},
 draw(G,g,t){const S=G.st,s=G.s,W=G.W,H=G.H;LANTERNS.forEach(([lx,ly],i)=>{const x=W*lx,y=H*ly,m=S.mice[i],w=46*s;
     if(m.up>.02){g.save();g.beginPath();g.rect(x-w,y-80*s,w*2,70*s);g.clip();drawEmoji(g,m.gold?"🐹":"🐭",x,y-10*s-m.up*38*s,32*s);g.restore();}
     g.fillStyle="#3a3f3b";g.fillRect(x-w*.55,y-12*s,w*1.1,14*s);g.fillStyle="#2c312e";g.fillRect(x-w*.35,y-44*s,w*.7,34*s);g.fillStyle="#454b47";g.beginPath();g.moveTo(x-w*.7,y-44*s);g.lineTo(x,y-64*s);g.lineTo(x+w*.7,y-44*s);g.fill();g.fillStyle="rgba(230,170,90,.35)";g.fillRect(x-w*.18,y-36*s,w*.36,18*s);});
   drawCatG(g,S.pounce&&t-S.pounce<.35?"play":"rest",S.pounce&&t-S.pounce<.35?4:0,W-60*s,H-10*s,.62*s);},
 down(G,x,y,t){const S=G.st;LANTERNS.forEach(([lx,ly],i)=>{const m=S.mice[i],mx=G.W*lx,my=G.H*ly-40*G.s;if(m.up>.4&&!m.hit&&Math.hypot(mx-x,my-y)<44*G.s){m.hit=t;m.until=t+.25;G.score+=m.gold?3:1;sfx("coin");S.pounce=t;}});},
 stat:G=>`🐭 ${G.score} · ${Math.ceil(Math.max(0,G.time))} с`}
];

function gResize(){const r=G.cv.getBoundingClientRect();G.W=r.width;G.H=r.height;const d=Math.min(2,devicePixelRatio||1);G.cv.width=r.width*d;G.cv.height=r.height*d;G.ctx.setTransform(d,0,0,d,0,0);G.s=clamp(Math.min(G.W/430,G.H/560),.6,1.3);if(G.def)G.bgc=gPaint(G.def.bg);}
function openGame(id){
  G.def=GAMES.find(g=>g.id===id);G.id=id;G.running=false;G.over=false;cancelAnimationFrame(G.raf);
  $("game").hidden=false;$("gTitle").textContent=G.def.n;$("gStat").textContent=G.def.tag;gResize();
  const g=G.ctx;g.clearRect(0,0,G.W,G.H);g.drawImage(G.bgc,0,0,G.W,G.H);
  const res=$("gResult");res.hidden=false;
  res.innerHTML=`<div class="card"><p class="tag">${G.def.tag}</p><h3>${G.def.n}</h3><p class="lore">${G.def.lore}</p><p><b>Как играть.</b> ${G.def.how}</p><div class="row"><button class="btn" id="gBack">Назад</button><button class="btn primary" id="gGo">Начать</button></div></div>`;
  $("gBack").onclick=closeGame;$("gGo").onclick=beginGame;
}
function beginGame(){
  audioInit();const t=now();G.st={};G.score=0;G.lives=G.def.lives;G.time=G.def.time;G.over=false;G.running=true;G.scareT=-9;G.held=false;G.last=t;
  $("gResult").hidden=true;G.def.init(G,t);cancelAnimationFrame(G.raf);G.raf=requestAnimationFrame(gFrame);
}
function closeGame(){cancelAnimationFrame(G.raf);$("game").hidden=true;G.id=null;G.running=false;ui();}
$("gClose").addEventListener("click",closeGame);
function gFrame(){
  const t=now(),dt=Math.min(.05,t-G.last);G.last=t;const g=G.ctx;
  if(!G.over){if(G.time!=null){G.time-=dt;if(G.time<=0){G.time=0;gEnd();}}if(G.lives!=null&&G.lives<=0&&t-G.scareT>.6)gEnd();}
  if(!G.over&&G.def.step)G.def.step(G,t,dt);
  g.save();const sh=clamp(1-(t-G.scareT)/.4,0,1)*8;g.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  g.clearRect(-10,-10,G.W+20,G.H+20);g.drawImage(G.bgc,0,0,G.W,G.H);G.def.draw(G,g,t);
  if(!G.def.scary)for(const q of sakura.list.slice(0,20))drawPetal(g,q.x*(G.W/Math.max(1,view.W)),q.y*(G.H/Math.max(1,view.H)),q.size,q.rot,.7);
  drawScare(g,t);g.restore();
  if(G.running)$("gStat").textContent=G.def.stat(G);
  if(G.running||t-G.scareT<.6)G.raf=requestAnimationFrame(gFrame);
}
function gLocal(ev){const r=G.cv.getBoundingClientRect();return[ev.clientX-r.left,ev.clientY-r.top];}
G.cv.addEventListener("pointerdown",ev=>{audioInit();if(!G.running||G.over)return;G.cv.setPointerCapture(ev.pointerId);G.held=true;const [x,y]=gLocal(ev);G.def.down&&G.def.down(G,x,y,now());});
G.cv.addEventListener("pointermove",ev=>{if(!G.running||G.over)return;const [x,y]=gLocal(ev);G.def.move&&G.def.move(G,x,y,G.held||ev.pointerType==="mouse");});
const gUp=()=>{G.held=false;if(G.running&&G.def&&G.def.up)G.def.up(G);};G.cv.addEventListener("pointerup",gUp);G.cv.addEventListener("pointercancel",gUp);
function gEnd(){
  if(G.over)return;G.over=true;G.running=false;const id=G.id,sc=G.score,rec=sc>(S.best[id]||0);if(rec)S.best[id]=sc;const coins=sc*3;S.earned+=coins;
  S.needs.joy=clamp(S.needs.joy+Math.min(30,8+sc),0,100);S.needs.energy=clamp(S.needs.energy-8,0,100);save();
  setTimeout(()=>{if(!G.id)return;const res=$("gResult");res.hidden=false;
    res.innerHTML=`<div class="card"><p class="tag">${G.def.tag}</p><h3>${rec&&sc>0?"Новый рекорд":G.lives!=null&&G.lives<=0?"Поймали…":"Готово"}</h3><div class="big">${sc}</div><p>+${coins} монет (баланс и так бесконечный). Рекорд: ${S.best[id]}.</p><div class="row"><button class="btn" id="gHome">Домой</button><button class="btn primary" id="gAgain">Ещё раз</button></div></div>`;
    $("gHome").onclick=closeGame;$("gAgain").onclick=beginGame;},650);
}

addEventListener("resize",()=>{resize();if(G.id&&!G.over)gResize();});

// ───────────────────────── Boot ─────────────────────────
grainPat=ctx.createPattern(makeGrain(),"repeat");fogTex=makeFog();
new ResizeObserver(()=>resize()).observe(cv);
loadImages().then(()=>{
  resize();ui();hudTick();weatherLabel();pet.idle.next=now()+1.5;
  react("😺",2.2);sakura.until=now()+8;sakura.next=now()+rand(40,80);
  $("loading").style.opacity=0;setTimeout(()=>$("loading").remove(),500);
  requestAnimationFrame(frame);
});
})();
</script>
