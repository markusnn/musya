<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1210">
<meta name="description" content="Мусин дом — мрачная японская игра с котёнком Мусей: комнаты, гардероб и страшные мини-игры по легендам Японии.">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Мусин дом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500&text=%E7%B8%81%E5%81%B4%E5%8F%B0%E6%89%80%E6%B8%A9%E6%B3%89%E5%AF%9D%E5%AE%A4%E8%A1%A3%E8%A3%85%E9%81%8A%E3%81%B3%E7%8C%AB%E5%AE%B6%E9%96%80%E4%B8%AD%E5%BA%AD&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#0d1210;
  --ink-2:#151c19;
  --moss:#232c27;
  --moss-2:#2f3a33;
  --fog:#98a19a;
  --paper:#d8d2c3;
  --muted:#7f8a83;
  --sakura:#eea3bb;
  --sakura-deep:#c9738f;
  --torii:#8e3a2c;
  --warn:#c26a5a;
  --line:rgba(216,210,195,.12);
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --ui:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
html,body{height:100%;}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;}
#app{height:100%;width:100%;min-width:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-inline:0;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
button:focus-visible{outline:2px solid var(--sakura);outline-offset:2px;border-radius:10px;}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;background:linear-gradient(var(--ink),rgba(13,18,16,.0));position:relative;z-index:3;}
.brand{display:flex;align-items:baseline;gap:6px;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1}
.brand i{font-style:normal;font-family:var(--jp);font-size:13px;color:var(--sakura);opacity:.8}
.coins{margin-left:auto;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mon{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9b86a,#8e6b2a);position:relative;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)}
.mon::after{content:"";position:absolute;inset:6px;background:var(--ink);border-radius:1px}
.coins span{font-size:18px;line-height:1}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;flex:none}
.needs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 16px 8px;position:relative;z-index:3}
.need{display:flex;flex-direction:column;gap:4px;min-width:0}
.need label{display:flex;justify-content:space-between;gap:4px;overflow:hidden;font-size:11px;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.need label em{font-style:normal;color:var(--paper);opacity:.85;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(216,210,195,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--fog);transition:width .6s ease, background .4s}
.need.low .bar i{background:var(--warn);animation:pulse 1.4s ease-in-out infinite}
.need.low label{color:var(--warn)}
@keyframes pulse{50%{opacity:.45}}

/* Stage */
.stage{flex:1;position:relative;min-height:0;margin:0 16px;border-radius:14px;overflow:hidden;background:#1a211d;box-shadow:0 0 0 1px var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.room-title{position:absolute;left:14px;top:10px;display:flex;align-items:baseline;gap:8px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.room-title b{font-family:var(--jp);font-weight:500;font-size:20px;color:var(--paper);opacity:.9}
.room-title span{font-family:var(--display);font-size:18px;font-weight:600;color:var(--fog)}
.hint{position:absolute;left:14px;right:14px;top:40px;font-size:12px;line-height:1.4;color:rgba(216,210,195,.6);pointer-events:none;text-shadow:0 1px 6px #000;max-width:30em;transition:opacity .6s}
.hint.off{opacity:0}
.toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:rgba(13,18,16,.85);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* Tray */
.tray{padding:10px 16px 6px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:6px}
.seg button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--paper);border-color:var(--paper)}
.items{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x proximity}
.items::-webkit-scrollbar{display:none}
.item{flex:none;width:84px;min-height:84px;border-radius:12px;background:var(--ink-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;scroll-snap-align:start;transition:transform .15s, border-color .2s}
.item:active{transform:scale(.95)}
.item .ico{font-size:26px;line-height:1;height:30px;display:grid;place-items:center}
.item .ico canvas{width:44px;height:30px}
.item .nm{font-size:11.5px;line-height:1.2;text-align:center;color:var(--paper)}
.item .pr{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.item .pr .mon{width:11px;height:11px}.item .pr .mon::after{inset:3.5px}
.item.on{border-color:var(--sakura);box-shadow:inset 0 0 0 1px var(--sakura)}
.item.on .pr{color:var(--sakura)}
.item.wide{width:132px}

/* Tabs */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(58px,1fr);overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--ink)}
.tabs button{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--muted);position:relative}
.tabs button b{font-family:var(--jp);font-weight:500;font-size:17px;line-height:1.1}
.tabs button span{font-size:10.5px;letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--paper)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;bottom:0;width:18px;height:2px;border-radius:2px;background:var(--sakura)}

/* Mini-game overlay */
.game{position:fixed;inset:0;z-index:20;background:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.game header{display:flex;align-items:center;gap:12px;padding:10px 16px}
.game header h2{font-family:var(--display);font-size:24px;font-weight:700;margin:0;flex:1;text-wrap:balance}
.game header .stat{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;white-space:nowrap}
.game .field{flex:1;position:relative;margin:0 16px 16px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.game canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,12,.72);backdrop-filter:blur(3px)}
.card{max-height:calc(100% - 32px);overflow-y:auto;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;width:min(320px,calc(100% - 32px));display:flex;flex-direction:column;gap:12px;text-align:center}
.card h3{font-family:var(--display);font-size:28px;margin:0}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.card .big{font-size:44px;font-weight:600;font-family:var(--display);color:var(--paper);line-height:1}
.card .row{display:flex;gap:8px}
.btn{flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gcard{border-radius:12px;background:var(--ink-2);border:1px solid var(--line);padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.gcard b{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.15}
.glist{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.glist h4{margin:2px 0 0;font-family:var(--display);font-size:16px;font-weight:600;color:var(--sakura);letter-spacing:.02em}
.card .tag{font-family:var(--jp);font-size:13px;color:var(--sakura);letter-spacing:.04em}
.card .lore{color:var(--paper);opacity:.85;text-align:left}
.card p b{color:var(--paper)}
.gcard span{font-size:11.5px;color:var(--muted);line-height:1.35}
.gcard em{font-style:normal;font-size:11px;color:var(--sakura);margin-top:2px}
.story{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 110%,rgba(200,130,60,.18),transparent 60%),#0b0f0d;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.story header{display:flex;align-items:center;gap:12px;padding:12px 16px}
.story h2{flex:1;margin:0;font-family:var(--display);font-size:26px;font-weight:700}
.story-body{flex:1;overflow-y:auto;padding:4px 16px 28px;max-width:40em;width:100%;margin:0 auto;box-sizing:border-box}
.story-body p{font-size:16px;line-height:1.65;margin:0 0 14px;color:var(--paper)}
.story-body h3{font-family:var(--display);font-size:30px;margin:10px 0 2px;text-wrap:balance}
.story-body .src{font-size:13px;color:var(--sakura);margin-bottom:18px}
.story-body .lead{color:var(--muted);font-size:14px}
.slist{display:grid;gap:8px}
.scard{text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.scard b{font-family:var(--display);font-size:20px}.scard span{font-size:12px;color:var(--muted)}
.story .back{color:var(--muted);font-size:13px;padding:6px 0}
.story .next{width:100%;margin-top:10px}
.bestiary{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.beast{border:1px solid var(--line);border-radius:12px;padding:10px;background:#07090a;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;opacity:.6}
.beast.on{opacity:1;border-color:rgba(194,106,90,.5)}
.beast img{height:110px;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 12px rgba(0,0,0,.8))}
.beast .q{height:110px;display:grid;place-items:center;font-size:40px;color:var(--muted)}
.beast b{font-family:var(--display);font-size:17px}.beast small{font-size:11.5px;color:var(--muted);line-height:1.35}
.story-body .bh{margin-top:26px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stamp{border:1px solid var(--line);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--ink-2);opacity:.55}
.stamp .seal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--jp),"Hiragino Mincho ProN",serif;font-size:28px;color:var(--muted);border:2px dashed rgba(216,210,195,.2)}
.stamp.on{opacity:1}.stamp.on .seal{color:#f3e6dc;background:radial-gradient(circle at 40% 35%,#c2453a,#8a2019);border:2px solid #6e1812;transform:rotate(-8deg)}
.stamp b{font-size:13px;font-weight:600}.stamp small{font-size:11px;color:var(--muted);line-height:1.3}
.fortune{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px}
.fortune .fk{font-family:var(--jp),"Hiragino Mincho ProN",serif;font-size:64px;color:#c2453a;border:2px solid #8a2019;border-radius:10px;padding:8px 22px;background:#e8e0cc;line-height:1.1}
.fortune.bad .fk{color:#1b1510;border-color:#1b1510}
.fortune p{max-width:26em}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:50;font-family:var(--display);font-size:22px;color:var(--fog);transition:opacity .5s}
@media (max-width:380px){.needs{gap:6px}.need label{font-size:10px}.tabs button span{font-size:9.5px}.brand i{display:none}}
@media (prefers-reduced-motion:reduce){.need.low .bar i{animation:none}}
.seg.scroll{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}.seg.scroll::-webkit-scrollbar{display:none}.seg button{white-space:nowrap;flex:none}
.quest{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);display:flex;gap:8px;align-items:flex-start;text-align:left;background:rgba(10,13,12,.82);border:1px solid rgba(238,163,187,.35);border-radius:12px;padding:7px 11px;font-size:12px;line-height:1.35;color:var(--paper);box-shadow:0 4px 18px rgba(0,0,0,.4);z-index:2}
.quest b{font-family:var(--display);font-size:14px;font-weight:700;color:var(--sakura)}.quest .qi{font-size:16px;line-height:1.2}
.scene{position:absolute;left:0;right:0;top:0;z-index:4;padding:14px 16px 46px;background:linear-gradient(rgba(6,8,7,.96),rgba(6,8,7,.9) 68%,rgba(6,8,7,0));cursor:pointer}
body.cine .tray,body.cine .tabs{display:none}
.scene .sc-head{font-family:var(--display);font-size:15px;font-weight:700;color:var(--sakura);letter-spacing:.02em;margin-bottom:6px}
.scene .sc-text{font-family:var(--display);font-size:18px;line-height:1.45;color:#ece5d4;max-width:34em;text-wrap:pretty}
.scene .sc-text.in{animation:scin .9s ease}@keyframes scin{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.scene .sc-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:10px}.scene .sc-row .scimg{margin-right:auto;filter:drop-shadow(0 0 12px rgba(238,163,187,.45))}
.scene .btn{flex:none;padding:8px 18px}
.stage.cine::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5%;background:#000;z-index:3;pointer-events:none}
.stage.cine .room-title,.stage.cine .hint{opacity:0;transition:opacity .6s}
.qch{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--ink-2)}.qch.lock{opacity:.45}.qch.cur{border-color:rgba(238,163,187,.55)}
.qch .qh{display:flex;gap:10px;align-items:center}.qch .qh img{height:44px}.qch b{font-family:var(--display);font-size:19px;display:block}
.qtasks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px;font-size:14px}.qtasks li.ok{color:var(--muted);text-decoration:line-through}.qtasks em{font-style:normal;color:var(--sakura)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-bottom:12px}.ci{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:6px 4px;border-radius:10px;background:#0a0d0c;border:1px solid var(--line)}
.ci .ath{filter:brightness(0) opacity(.35)}.ci.on .ath{filter:none}.ci img{height:52px;max-width:100%;object-fit:contain;filter:brightness(0) opacity(.35)}.ci.on img{filter:none}.ci small{font-size:10px;line-height:1.2;color:var(--muted)}.ci.on small{color:var(--paper)}
.story-body h4.ch{font-family:var(--display);font-size:17px;margin:12px 0 6px;color:var(--sakura)}
.story-body .jbtn{margin:0 0 14px}
/* Festivals, guests, pantry, fair */
.iconbtn{position:relative}
.iconbtn.dot::after{content:"";position:absolute;top:1px;right:1px;width:8px;height:8px;border-radius:50%;background:var(--sakura);box-shadow:0 0 6px var(--sakura)}
.tabs button.dot::before{content:"";position:absolute;top:4px;right:calc(50% - 17px);width:7px;height:7px;border-radius:50%;background:var(--sakura);box-shadow:0 0 6px var(--sakura)}
.fchip{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:6px;background:rgba(10,13,12,.8);border:1px solid rgba(238,163,187,.4);border-radius:999px;padding:4px 11px 4px 8px;font-size:12px;color:var(--paper);z-index:2}
.fchip b{font-family:var(--display);font-size:15px;font-weight:700}.fchip em{font-style:normal;color:var(--sakura);font-variant-numeric:tabular-nums}
.cine .fchip{display:none}
.gdlg{cursor:default}.gdlg .sc-row{flex-wrap:wrap}
#gdImg{display:flex;align-items:center;gap:8px}
.gdw{display:flex;flex-direction:column;font-size:13px;color:var(--paper);line-height:1.3}.gdw small{color:var(--muted)}
.item .pr.own{color:var(--sakura);font-weight:700}
.item.lack{opacity:.55}
.fest-now{border:1px solid rgba(238,163,187,.4);border-radius:14px;padding:12px 14px;background:linear-gradient(rgba(238,163,187,.07),rgba(0,0,0,0));margin:6px 0 10px}
.fh,.fy{display:flex;align-items:center;gap:12px}
.fh .fi{font-size:40px;line-height:1}.fy .fi{font-size:24px;width:32px;text-align:center}
.fh b{font-family:var(--display);font-size:28px}.fh i,.fy i{font-style:normal;font-family:var(--jp);color:var(--sakura);font-size:14px}
.fh small,.fy small{display:block;color:var(--muted);font-size:12.5px}
.story-body .fest-now p{font-size:15px;margin:10px 0}
.freward{display:flex;align-items:center;gap:12px;margin:12px 0 4px;font-size:14px;color:var(--muted)}.freward b{color:var(--paper)}
.fyear{display:grid;gap:6px}
.fy{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--ink-2)}
.fy.now{border-color:rgba(238,163,187,.55)}
.fy b{font-family:var(--display);font-size:18px}.fy>div{flex:1;min-width:0}
.fy em{font-style:normal;font-size:12px;color:var(--sakura);text-align:right;max-width:40%}
.guest{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--ink-2)}
.guest img{height:96px;flex:none}.guest .q,.ci .q{width:60px;height:60px;flex:none;display:grid;place-items:center;font-size:30px;color:var(--muted)}
.guest b{font-family:var(--display);font-size:20px}.story-body .guest p{font-size:14px;margin:4px 0 0;line-height:1.45}
.hearts{color:var(--sakura);letter-spacing:1px}
.wish .wrow{display:flex;gap:8px}.wish input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#07090a;color:var(--paper);font:inherit}
.tzs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.tanzaku{writing-mode:vertical-rl;padding:10px 6px;border-radius:3px;font-size:13px;max-height:170px;color:#1a1410}
.tanzaku.c0{background:#e8a0b6}.tanzaku.c1{background:#a8d0e8}.tanzaku.c2{background:#f2e08a}.tanzaku.c3{background:#b8e0a8}.tanzaku.c4{background:#d8c0f0}
.catch{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.catch>span{display:flex;flex-direction:column;align-items:center;gap:2px}.catch small{font-size:11px;color:var(--muted);max-width:90px}
.card .dish{display:flex;justify-content:center;filter:drop-shadow(0 0 16px rgba(238,163,187,.35))}
.card .stars{font-size:30px;color:#f2c86a;letter-spacing:4px}

function loop(name){
  if(!snd.on||!snd.ctx)name=null;
  if(snd.cur===name)return;

}
function sfx(kind){

  if(kind==="pop")tone(520,980,.09,"sine",.1);
  else if(kind==="coin"){tone(1320,1320,.08,"triangle",.07);setTimeout(()=>tone(1760,1760,.14,"triangle",.07),70);}

  else if(kind==="bad")tone(220,90,.28,"square",.05);

function pose(t){

  switch(a){

    case"cursor":
      if(pet.moving){set(pet.heading>0?"moveRight":"moveLeft",Math.floor(pet.walk)%8);p.fade=false;}else set("play",Math.floor(e*3.5)%8);break;
    case"purr":set("purr",Math.floor(e*1.8)%8);break;
    case"yarn":set("yarn",Math.floor(e*2.5)%8);break;
    case"sleep":if(e<2.8)set("sleep",Math.min(7,Math.floor(e/2.8*8)));else{set("sleep",7);p.breath=1+Math.sin(e*1.8)*.008;}break;

    case"refuse":e<1.6?set(pet.variant%2?"gaze9":"gaze10",pet.variant%2?4:4):set("rest",1);break;

    case"poke":set("play",[0,3,3,5,5,1][Math.min(5,Math.floor(e/.28))]);break;

      else if(e<5.3)set("sulk",Math.min(3,Math.floor((e-4.3)*4)));else if(e<6.8)set("sulk",4+Math.floor(e*1.6)%2);else set("sulk",Math.min(7,6+Math.floor((e-6.8)/.4)));break;
    case"meow":if((e>=.4&&e<1.3)||(e>=2.6&&e<3.4))set("stretch",5);else if((e>=2.2&&e<2.6)||e>=3.4)set("rest",1);else set("rest",0);break;
    case"music":{const act=e>.6&&e<9.3;set("rest",act?(Math.floor(e/2.6)%3===2?5:4):0);p.sway=4*Math.sin(e*2*Math.PI/1.3)*smooth(Math.min(e/.8,(10-e)/.8));break;}

function update(t,dt){

  n.energy=clamp(n.energy+dt*(sleeping?(S.lampOff?30:14):-1.6)/60,0,100);}
  if(pet.action==="purr")n.joy=clamp(n.joy+dt*3,0,100);
  const e=t-pet.start,d=DUR[pet.action];
  if(d&&e>=d)start("idle",true);
  if(pet.action==="sleep"&&pet.napUntil&&t>pet.napUntil)start("stretch",true);
  if(pet.action==="sleep"&&S.room==="bedroom"&&!S.lampOff&&!pet.napUntil&&e>1)start("stretch",true);

  if(pet.action==="idle"&&t>nextAuto&&!drag.active&&!scene.on&&!away){
    let a;if(n.energy<28)a="sleep";else if(n.joy<40||n.food<30)a="beg";else if(n.clean<30)a="groom";

  }

  if(pet.action==="cursor"&&pointer.known){const dx=pointer.x-pet.x;if(Math.abs(dx)>90*s){const want=pointer.x-Math.sign(dx)*80*s,step=Math.sign(want-pet.x)*Math.min(Math.abs(want-pet.x),230*s*dt);if(Math.abs(step)>.3){pet.x=clamp(pet.x+step,minX,maxX);pet.walk+=Math.abs(step)/(26*s);pet.heading=Math.sign(dx);pet.moving=true;}}}
  if(pet.action==="zoomies"){const seg=clamp(view.W/(520*s),1,1.8),pts=[pet.home,maxX,minX,maxX,pet.home];if(e<seg*4){const i=Math.min(3,Math.floor(e/seg)),u=(e-i*seg)/seg,x=mix(pts[i],pts[i+1],u+(smooth(u)-u)*.65);const dx=x-pet.x;if(Math.abs(dx)>.2)pet.heading=Math.sign(dx);pet.walk+=Math.abs(dx)/(30*s);pet.x=x;pet.moving=true;}}

    else{const a=pet.walkAfter||"idle";start(a);if(a==="sleep")pet.napUntil=now()+35;}}
  if(pet.action==="gift"&&e<2.6){const dir=pet.home+60*s<=maxX?1:-1;pet.x=clamp(pet.home+dir*60*s*smooth(e/2.6),minX,maxX);}

  for(const d of pet.drops){d.y+=d.vy*dt;d.vy+=500*dt;d.a-=dt*.8;}pet.drops=pet.drops.filter(d=>d.a>0&&d.y<view.H);
  if(pet.rinsing){for(const f of pet.foam)f.a-=dt*.9;pet.foam=pet.foam.filter(f=>f.a>0);if(!pet.foam.length)pet.rinsing=false;}
  updateSakura(t,dt);updateFall(t,dt);updateWeather(t,dt);updateSpook(t);
  if(scene.on){const e=t-scene.t0;cam.tx=Math.sin(e*.22)*1.15;cam.ty=.35+.2*Math.sin(e*.17);cam.last=t;}
  updateVisit(t);
  if(t-cam.last>3){cam.tilt=false;cam.tx=.38*Math.sin(t*.13)+clamp((pet.x/view.W-.5)*.9,-.5,.5);cam.ty=.2*Math.sin(t*.09+1);}

const SEEN_OF={bettari:"bettari",rokuro:"rokuro",onryo:"onryo",peek:"peek",okubi:"okubi",face:"face",shadow:"yurei",shadow_bed:"yurei",torii:"yurei",obake:"obake",kitsunebi:"kitsunebi"};
function drawMon(id,ix,iy,hImg,d,alpha,anchor="b",rot=0,flipX=false){
  const im=MIMG[id],m=MON[id];if(!im||!m||alpha<=0)return;const sc=hImg/m[1]*BGM.k,w=m[0]*sc,h=m[1]*sc,[x,y]=imgToStage(ix,iy,d);
  ctx.save();ctx.globalAlpha=Math.min(1,alpha);ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flipX)ctx.scale(-1,1);ctx.drawImage(im,-w/2,anchor==="b"?-h:anchor==="c"?-h/2:0,w,h);ctx.restore();}
function visX(ix,m=0){const l=-BGM.dx/BGM.k+m,r=(view.W-BGM.dx)/BGM.k-m;return l>r?(l+r)/2:clamp(ix,l,r);}
function visR(){return(view.W-BGM.dx)/BGM.k;}
function bez(p0,p1,p2,u){const a=1-u;return[a*a*p0[0]+2*a*u*p1[0]+u*u*p2[0],a*a*p0[1]+2*a*u*p1[1]+u*u*p2[1]];}
function drawNeck(pts,wid,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.lineCap="round";ctx.lineJoin="round";
  for(const [col,k] of [["#8f877c",1],["#c9c2b5",.78],["#e2ddd2",.4]]){ctx.strokeStyle=col;ctx.lineWidth=wid*k;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}ctx.restore();}
const MON_SPOTS={
  bettari:{entrance:[900,1020,1150,380,560,.38,.7],engawa:[1080,1085,1110,340,420,.42,.5],games:[1240,1180,1300,360,520,.45,.8],courtyard:[1300,1010,1120,330,440,.55,.8]},
  rokuro:{kitchen:[[760,-80],[220,260],[600,480],.5,300],bedroom:[[1560,150],[1500,560],[1120,520],.4,320],engawa:[[1400,112],[1300,500],[1100,470],.6,260]},
  onryo:{bedroom:[1010,1215,520,.5],wardrobe:[1440,1160,560,.5],kitchen:[180,1170,560,.5]},
  peek:{bedroom:[1700,1330,.8,1],kitchen:[1720,1335,.8,1],engawa:[1380,1112,.92,1],onsen:[1760,1330,.82,1]},
  okubi:{courtyard:[1080,520,540,.3],games:[900,640,600,.22],entrance:[900,760,420,.38],onsen:[900,560,560,.2]}
};
function monSound(kind){if(!snd.on||!snd.ctx)return;
  if(kind==="rokuro"){tone(120,1.2,"sawtooth",.04);tone(90,1.6,"sine",.05);}
  else if(kind==="onryo"){const c=snd.ctx,b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*.25*Math.sin(Math.PI*i/dd.length);const src=c.createBufferSource();src.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=3000;f.Q.value=2;src.connect(f);f.connect(c.destination);src.start();}
  else if(kind==="okubi"){tone(55,4,"sine",.08);tone(58,4,"sine",.05);}
  else if(kind==="peek"){tone(900,.05,"square",.02);}
  else tone(55,1.4,"sawtooth",.05);}
function drawMonsters(ev,e,fade){
  const k=ev.kind,room=S.room,sp=(MON_SPOTS[k]||{})[room];
  if(k==="bettari"&&sp){const [x0,y0,y1,h0,h1,d0,d1]=sp,x=visX(x0,200),u=smooth(clamp((e-1)/2.4,0,1)),open=e>3.4;const d=mix(d0,d1,u);
    if(open&&!ev.shriek){ev.shriek=1;scareSound();pet.gazeUntil=0;}
    const sh=open?Math.sin(e*60)*4:0;drawMon(open?"m_bettari_open":"m_bettari",x+sh,mix(y0,y1,u),mix(h0,h1,u)*(open?1.08:1),d,fade*(e<.9?e/.9:1));}
  else if(k==="rokuro"&&sp){const [a0,b0,c0,d,hh]=sp,sx=visX(c0[0],170)-c0[0],a=[a0[0]+sx,a0[1]],b=[b0[0]+sx,b0[1]],c=[c0[0]+sx,c0[1]],u=e<1.6?smooth(e/1.6):e<3.6?1:1-smooth((e-3.6)/1);
    const sway=Math.sin(e*2.2)*30*u,c2=[c[0]+sway,c[1]+Math.cos(e*1.7)*14*u],N=24,pts=[];for(let i=0;i<=N;i++){const q=bez(a,b,c2,i/N*u);pts.push(imgToStage(q[0],q[1],d));}
    drawNeck(pts,34*BGM.k*2.2,fade);const hp=bez(a,b,c2,u);drawMon("m_rokuro",hp[0],hp[1]+hh*.45,hh,d,fade,"b",Math.sin(e*1.5)*.18);}
  else if(k==="onryo"&&sp){const [x0,y,h,d]=sp,x=visX(x0,150),fl=(Math.sin(e*23)>.2||e>1.2)?1:.25;drawMon("m_onryo",x,y,h,d,fade*fl*(e>4.4?Math.max(0,1-(e-4.4)*3):1));}
  else if(k==="peek"&&sp){const [x0,y,d]=sp,x=Math.min(x0,visR()-175),u=e<1?smooth(e):e<3.4?1:1-smooth((e-3.4)/.5);drawMon("m_peek",x+(1-u)*(visR()-x+200),y,230,d,fade);}
  else if(k==="okubi"&&sp){const [x,y,h,d]=sp,al=clamp(Math.min(e/2.2,(ev.dur-e)/1.4),0,1)*.68;drawMon("m_okubi",x+Math.sin(e*.5)*20,y+Math.sin(e*.7)*12,h*(1+e*.02),d,al,"c");
    ctx.save();ctx.globalAlpha=.3*al;const fw=900*view.s*1.3,fh=260*view.s*1.3;ctx.drawImage(fogTex,-((e*20)%fw),view.H*.25,fw,fh);ctx.drawImage(fogTex,fw-((e*20)%fw),view.H*.25,fw,fh);ctx.restore();}
  else if(k==="face"){const im=MIMG.m_onryo_face;if(!im)return;const a=e/ev.dur,sz=Math.max(view.W,view.H)*(.75+.5*a),al=a<.12?a/.12:a>.75?(1-a)/.25:1;
    ctx.fillStyle=`rgba(0,0,0,${.85*al})`;ctx.fillRect(0,0,view.W,view.H);ctx.globalAlpha=al;ctx.drawImage(im,view.W/2-sz/2+Math.sin(e*50)*6,view.H/2-sz/2,sz,sz);ctx.globalAlpha=1;}
}
function scareSound(){if(!snd.on||!snd.ctx)return;const c=snd.ctx,n=c.currentTime,b=c.createBuffer(1,c.sampleRate*.7,c.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,1.2);
  const src=c.createBufferSource();src.buffer=b;const f=c.createBiquadFilter();f.type="highpass";f.frequency.value=1200;const g=c.createGain();g.gain.value=.3;src.connect(f);f.connect(g);g.connect(c.destination);src.start(n);tone(1400,.6,"sawtooth",.04);tone(70,.7,"sawtooth",.09);}

const KAIDAN=[
 {t:"Безликая у рва",src:"«Мудзина», Лафкадио Хирн, «Кайдан», 1904",p:["В Токио есть склон Кии-но-куни-дзака. С одной его стороны — старый глубокий ров, с другой — высокие стены княжеской усадьбы. В те времена, когда ещё не было уличных фонарей, после заката здесь старались не ходить.","Однажды поздно вечером по склону торопился купец и увидел у рва девушку. Она сидела одна и горько плакала, закрыв лицо рукавом. Купец испугался, что она задумала броситься в воду, и заговорил с ней ласково: «Не плачьте, расскажите, что случилось». Девушка всхлипывала и не отвечала. Он тронул её за плечо.","Тогда она опустила рукав и медленно повернулась. У неё не было лица: ни глаз, ни носа, ни рта — только гладкая кожа, как яичная скорлупа.","Купец с криком бросился бежать и бежал, пока не увидел огонёк. Это был фонарь ночного продавца лапши. «Там… у рва… девушка… у неё лицо…» — задыхался купец. «Вот такое?» — спросил продавец и провёл ладонью по своему лицу. Оно стало гладким, как яйцо. И фонарь погас."]},
 {t:"Хоити Безухий",src:"«Мими-наси Хоити», Лафкадио Хирн, «Кайдан», 1904",p:["Слепой монах Хоити лучше всех пел под бива «Повесть о доме Тайра» — о морской битве при Дан-но-ура, где погиб весь род Тайра вместе с малолетним императором. Жил он в храме Амидадзи у самого моря.","Однажды ночью за ним пришёл самурай: «Мой господин желает тебя послушать». Он вёл Хоити через ворота, по камням, в зал, полный шелеста шёлка и шёпота. Хоити пел — и слышал, как невидимые слушатели рыдают. Так было каждую ночь, и Хоити слабел.","Слуги храма проследили за ним и нашли его одного под дождём, на кладбище Тайра: он пел среди могил, а вокруг горели блуждающие огни. Настоятель понял, что мёртвые не отпустят певца. Он исписал всё тело Хоити священной сутрой и велел сидеть неподвижно и молчать.","Ночью самурай звал его, но видел пустоту. Только в темноте висели два уха — их забыли покрыть письменами. «Отнесу господину хоть это», — сказал голос, и уши оторвали. Хоити выжил. С тех пор его зовут Хоити Безухий."]},
 {t:"Снежная женщина",src:"«Юки-онна», Лафкадио Хирн, «Кайдан», 1904",p:["Старый дровосек Мосаку и юный Минокити возвращались из леса, когда началась метель. Лодочник уже ушёл, и они укрылись в его хижине у реки. Ночью Минокити проснулся от снега на лице: дверь была открыта, а над Мосаку склонилась женщина в белом. Она дохнула на старика — и его дыхание стало белым дымом.","Потом она наклонилась к Минокити. Лицо её было прекрасным, а глаза — страшными. «Ты молод, я тебя пощажу, — сказала она. — Но если расскажешь кому-нибудь о том, что видел, я узнаю. И тогда убью тебя». Утром Мосаку нашли замёрзшим.","Через год Минокити встретил на дороге девушку О-Юки. Они поженились, у них родилось десять детей, а О-Юки совсем не старела. Однажды вечером, глядя на неё при свете лампы, Минокити сказал: «Ты напоминаешь мне одну женщину…» — и рассказал о той ночи.","О-Юки поднялась: «Это была я! Я обещала убить тебя, если скажешь хоть слово. Только ради детей ты жив». Её голос стал тонким, как вой ветра, и она растаяла белым туманом. Больше её никто не видел."]},
 {t:"Тарелки Окику",src:"«Банчо Сараясики», легенда эпохи Эдо",p:["В доме самурая Аоямы служила девушка Окику. Ей доверили беречь десять драгоценных тарелок фамильного сервиза. Однажды одна тарелка исчезла — по одной версии, её спрятал сам хозяин, по другой — завистливый слуга.","Сколько бы Окику ни пересчитывала, тарелок было девять. Её обвинили в пропаже и бросили в старый колодец в саду.","С тех пор каждую ночь из колодца доносится тихий голос: «Одна… две… три… четыре…» — и так до девяти. А после девятой тарелки раздаётся крик, от которого слышавшие его заболевали.","Говорят, Окику затихла, лишь когда смельчак крикнул в колодец: «Десять!». Колодец Окику до сих пор показывают в замке Химэдзи."]},
 {t:"Лицо в фонаре",src:"«Ёцуя-кайдан», пьеса кабуки Цуруи Намбоку IV, 1825",p:["Ронин Тамия Иэмон был женат на кроткой О-Иве, но захотел жениться на богатой соседке. Её семья прислала О-Иве «лекарство» — на самом деле яд. Волосы О-Ивы стали выпадать клоками, один глаз опух и закрылся. Увидев себя в зеркале, она поняла, что её предали, и умерла, проклиная мужа.","Иэмон женился на богатой невесте. Но в первую же ночь он поднял покрывало — и увидел изуродованное лицо О-Ивы. Он выхватил меч и ударил — а на полу лежала его невеста.","С тех пор лицо О-Ивы смотрело на Иэмона из бумажных фонарей, выплывало из дыма, шептало из воды. Он потерял рассудок.","Эту историю считают самым страшным японским кайданом. Актёры до сих пор перед постановкой приходят к святилищу О-Ивы в Ёцуе просить прощения — говорят, иначе беды не миновать."]},
 {t:"Летающие головы",src:"«Рокурокуби», Лафкадио Хирн, «Кайдан», 1904",p:["Монах Кайрё, в прошлом храбрый самурай, странствовал по горам провинции Каи. Лесоруб пригласил его переночевать в хижине, где жили ещё четверо. Все были очень учтивы.","Ночью Кайрё вышел попить воды и увидел в комнате пять тел — без голов. Ран на шеях не было: головы просто отделились. Монах понял, что это рокурокуби — существа, чьи головы по ночам улетают охотиться. А если спрятать тело, голова не сможет вернуться.","Он вытащил тело хозяина наружу. Из леса донеслись голоса: головы летали среди деревьев, ловили насекомых и спорили, как бы съесть толстого монаха. Когда они нашли Кайрё, началась битва. Монах отбивался молодым деревцем, пока головы не пали. Лишь голова хозяина вцепилась зубами в его рукав и так и умерла.","Кайрё продолжил путь с головой, висящей на рукаве. В соседней деревне его чуть не схватили как убийцу, пока судья не разглядел на шее головы красные знаки — метки рокурокуби."]},
 {t:"Кошка из Набэсимы",src:"Легенда эпохи Эдо о княжеском роде Набэсима",p:["Князь Набэсима из Хидзэна любил красавицу О-Тоё. Однажды ночью в её покои пробралась огромная кошка-оборотень. Она погубила девушку и приняла её облик.","С тех пор князь начал чахнуть. Каждую ночь его мучили кошмары, и никакие лекари не помогали. Сотня стражников дежурила у его постели, но к полуночи всех их одолевал непреодолимый сон.","Молодой воин Ито Сода вызвался сторожить. Когда накатила сонливость, он вонзил нож себе в бедро, чтобы боль не давала уснуть. В полночь дверь бесшумно открылась, и вошла «О-Тоё». Увидев неспящего Ито, она отступила. Так было несколько ночей, и князь начал поправляться.","Тогда Ито пришёл к «О-Тоё» с копьём. Она прыгнула на крышу и обернулась огромной кошкой. Её загнали в горы, и князь выздоровел. Муся уверяет, что эта история не про неё."]},
 {t:"Рот без лица",src:"Охагуро-бэттари, «Эхон хякумоногатари» Такэхары Сюнсэна, 1841",p:["Поздно вечером у ворот старого храма стоит молодая женщина в дорогом кимоно. Она стоит спиной к дороге, и высокая причёска гейши чуть покачивается, будто она плачет.","Прохожий, пожалев её, подходит и спрашивает, не нужна ли помощь. Женщина медленно поворачивается. У неё нет ни глаз, ни носа, ни бровей — только гладкая белая кожа. А потом открывается рот: огромный, от уха до уха, полный чёрных зубов.","Чернить зубы — охагуро — когда-то было обычаем замужних женщин в Японии. Поэтому чёрный оскал на пустом лице казался людям особенно жутким. Одни говорили, что это проделки лисы или тануки, другие — что это дух невесты, не дождавшейся свадьбы.","Кто видел её, обычно бежал без оглядки. А она ещё долго смеялась своим чёрным ртом ему вслед."]},
 {t:"Голова в облаках",src:"Оокуби, «Кондзяку хякки сюи» Ториямы Сэкиэна, 1781",p:["Художник Торияма Сэкиэн, собиравший ёкаев в иллюстрированные книги, нарисовал и Оокуби — «большую голову». Она появляется в небе над крышами, в тумане или в окне второго этажа.","Голова бывает огромной, во всё небо, часто это женское лицо с чернёными зубами. Она ничего не делает: просто висит и смотрит — или медленно улыбается.","Говорили, что Оокуби видят те, кто затаил в сердце дурное, или что она предвещает беду в доме. Если голова показалась в облаках над деревней — ночью люди не открывали ставен.","Муся, кажется, уже видела её над водопадом во дворике."]},
 {t:"Ханако из третьей кабинки",src:"Городская легенда японских школ, популярна с 1980-х",p:["В каждой японской школе рассказывают про Ханако-сан — девочку в красной юбке, которая живёт в туалете третьего этажа, в третьей кабинке.","Чтобы её позвать, нужно постучать в дверь три раза и спросить: «Ханако-сан, ты здесь?» Если в ответ раздастся тихое «Да…», лучше сразу бежать. Говорят, некоторые видели, как из-под двери на них смотрит бледное лицо — перевёрнутое, с волосами, разлитыми по полу.","Кто она — никто точно не знает. По одной версии, девочка погибла в школе во время войны, по другой — пряталась в туалете в игре в прятки и так и не нашлась.","Легенда стала такой популярной, что в 1990-х о ней сняли несколько фильмов. А школьники до сих пор обходят третью кабинку стороной."]},
 {t:"Женщина в маске",src:"Городская легенда, паника 1979 года",p:["Весной 1979 года по японским школам поползли слухи: в сумерках к одиноким прохожим подходит высокая женщина в длинном плаще и марлевой маске. Она спрашивает: «Я красивая?»","Если ответить «нет» — беда. Если сказать «да», она медленно снимет маску: её рот разрезан от уха до уха. «А теперь?» — спросит она. Бежать бесполезно: она всегда оказывается впереди.","Говорили, что спастись можно, ответив «так себе», бросив ей леденцы бэккоамэ или трижды сказав слово «помада». Слухи были такими сильными, что в некоторых городах учителя провожали детей домой группами.","Похожие рассказы находят ещё в эпоху Эдо: там это была лиса-оборотень, прикидывающаяся красавицей."]}
];

// ───────────────────────── Time of day, crows, frogs, fireflies ─────────────────────────
// ?hour=2.5 in the address fakes the time of day (for checking night things)
function hourNow(){const q=new URLSearchParams(location.search).get("hour");return q!=null&&q!==""?+q:new Date().getHours()+new Date().getMinutes()/60;}
function dayTint(){const h=hourNow();
  if(h>=21.5||h<4.5)return["rgba(6,10,30,.36)",true];if(h>=19)return[`rgba(40,26,60,${.12+.2*(h-19)/2.5})`,h>20.5];if(h>=17)return["rgba(90,50,30,.1)",false];if(h<7)return["rgba(60,55,70,.14)",false];return[null,false];}
const crow={next:now()+rand(40,90),t:-9,dir:1,y:.2};
const nightFlies=Array.from({length:10},()=>({u:Math.random(),v:Math.random(),ph:Math.random()*6}));
let nextFrog=0;
function drawAmbient(t){
  const [tint,night]=dayTint(),out=["engawa","onsen","games","courtyard","entrance"].includes(S.room);
  if(tint){ctx.fillStyle=tint;ctx.fillRect(0,0,view.W,view.H);}
  if(night&&out&&!weather.on){const reg=S.room==="engawa"?[64,300,1380,1100]:[0,500,1800,1300],[x0,y0]=imgToStage(reg[0],reg[1]),[x1,y1]=imgToStage(reg[2],reg[3]);
    for(const f of nightFlies){const x=mix(x0,x1,(f.u+.03*Math.sin(t*.4+f.ph))%1),y=mix(y0,y1,(f.v+.04*Math.sin(t*.5+f.ph*2))%1),a=.35+.65*Math.max(0,Math.sin(t*1.7+f.ph));
      const gr=ctx.createRadialGradient(x,y,0,x,y,9*view.s);gr.addColorStop(0,`rgba(214,242,122,${.7*a})`);gr.addColorStop(1,"rgba(214,242,122,0)");ctx.fillStyle=gr;ctx.fillRect(x-9*view.s,y-9*view.s,18*view.s,18*view.s);}}
  if(out&&t>crow.next){crow.t=t;crow.dir=Math.random()<.5?1:-1;crow.y=rand(.08,.25);crow.next=t+rand(70,160);if(snd.on&&snd.ctx){tone(640,.22,"sawtooth",.035);setTimeout(()=>tone(560,.3,"sawtooth",.035),260);}}
  const ce=t-crow.t;if(out&&ce<4){const u=ce/4,x=crow.dir>0?mix(-40,view.W+40,u):mix(view.W+40,-40,u),y=view.H*crow.y+Math.sin(u*9)*6,w=Math.sin(t*12)*9*view.s,s2=view.s;
    ctx.save();ctx.fillStyle="#0a0b0c";ctx.translate(x,y);ctx.scale(crow.dir,1);ctx.beginPath();ctx.ellipse(0,0,11*s2,4*s2,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-4*s2,0);ctx.quadraticCurveTo(-10*s2,-w-6*s2,-22*s2,-w);ctx.lineTo(-2*s2,2*s2);ctx.fill();ctx.beginPath();ctx.moveTo(10*s2,-1*s2);ctx.lineTo(16*s2,1*s2);ctx.lineTo(10*s2,2*s2);ctx.fill();ctx.restore();}
  if(S.room==="onsen"&&weather.on&&t>nextFrog){nextFrog=t+rand(2.5,6);if(snd.on&&snd.ctx){tone(190,.07,"square",.04);setTimeout(()=>tone(170,.09,"square",.04),110);}}
}

function wobAng(id,t){const e=t-(wob[id]??-9);return e<1.4?.14*Math.sin(e*16)*Math.exp(-e*3.2):0;}
function spriteBox(it){const m=DMETA[it.imgId||it.id],sc=it.sc||1,x0=m[2]==="l"?it.x:it.x-m[0]*sc/2,y0=m[2]==="t"?it.y:m[2]==="c"||m[2]==="l"?it.y-m[1]*sc/2:it.y-m[1]*sc;return[x0,y0,m[0]*sc,m[1]*sc];}

      if(Math.hypot(p.x-k.x,p.z-k.z)<16){pellets.splice(pellets.indexOf(p),1);ripples.push({x:p.x,z:p.z,t});tone(520+Math.random()*200,.06,"sine",.03);}}

  G.def=GAMES.find(g=>g.id===id);G.id=id;G.running=false;G.over=false;cancelAnimationFrame(G.raf);
  $("game").hidden=false;$("gTitle").textContent=G.def.n;$("gStat").textContent=G.def.tag;gResize();
  const g=G.ctx;g.clearRect(0,0,G.W,G.H);g.drawImage(G.bgc,0,0,G.W,G.H);
  const res=$("gResult");res.hidden=false;
  res.innerHTML=`<div class="card"><p class="tag">${G.def.tag}</p><h3>${G.def.n}</h3><p class="lore">${G.def.lore}</p><p><b>Как играть.</b> ${G.def.how}</p><div class="row"><button class="btn" id="gBack">Назад</button><button class="btn primary" id="gGo">Начать</button></div></div>`;
  $("gBack").onclick=closeGame;$("gGo").onclick=beginGame;
}
function beginGame(){
  audioInit();const t=now();G.st={};G.score=0;G.lives=G.def.lives;G.time=G.def.time;G.over=false;G.running=true;G.scareT=-9;G.held=false;G.last=t;

}
function closeGame(){cancelAnimationFrame(G.raf);$("game").hidden=true;G.id=null;G.running=false;ui();}
$("gClose").addEventListener("click",closeGame);
function gFrame(){
  const t=now(),dt=Math.min(.05,t-G.last);G.last=t;const g=G.ctx;
  if(G.running||t-G.scareT<.6)G.raf=requestAnimationFrame(gFrame);   // keep the loop alive even if one frame throws
  try{gTick(g,t,dt);}catch(e){console.error(e);try{g.restore();}catch(e2){}}
}
function gTick(g,t,dt){
  if(!G.over){if(G.time!=null){G.time-=dt;if(G.time<=0){G.time=0;gEnd();}}if(G.lives!=null&&G.lives<=0&&t-G.scareT>.6)gEnd();}
  if(!G.over&&G.def.step)G.def.step(G,t,dt);
  g.save();const sh=clamp(1-(t-G.scareT)/.4,0,1)*8;g.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  g.clearRect(-10,-10,G.W+20,G.H+20);g.drawImage(G.bgc,0,0,G.W,G.H);G.def.draw(G,g,t);
  if(!G.def.scary)for(const q of sakura.list.slice(0,20))drawPetal(g,q.x*(G.W/Math.max(1,view.W)),q.y*(G.H/Math.max(1,view.H)),q.size,q.rot,.7);
  drawScare(g,t);g.restore();
  if(G.running)$("gStat").textContent=G.def.stat(G);
}
function gLocal(ev){const r=G.cv.getBoundingClientRect();return[ev.clientX-r.left,ev.clientY-r.top];}
G.cv.addEventListener("pointerdown",ev=>{audioInit();if(!G.running||G.over)return;G.cv.setPointerCapture(ev.pointerId);G.held=true;const [x,y]=gLocal(ev);G.def.down&&G.def.down(G,x,y,now());});

  if(G.over)return;G.over=true;G.running=false;stat("games",G.id);qev("game",{id:G.id,score:G.score});if(G.score>=10)award("champ");const id=G.id,sc=G.score,rec=sc>(S.best[id]||0);if(rec)S.best[id]=sc;const coins=sc*3;S.earned+=coins;

   for(const sh of q.shells){const u=clamp((t-sh.t0)/sh.T,0,1.3),e=1-Math.pow(1-Math.min(u,1),2),x=mix(sh.x0,sh.x,e),y=mix(sh.y0,sh.ay,e);sh.cx=x;sh.cy=y;
     g.fillStyle="rgba(255,220,160,.9)";g.beginPath();g.arc(x,y,3*s,0,Math.PI*2);g.fill();for(let k=1;k<6;k++){const e2=1-Math.pow(1-Math.max(0,Math.min(u,1)-k*.02),2);g.fillStyle=`rgba(255,180,90,${.5-k*.08})`;g.beginPath();g.arc(mix(sh.x0,sh.x,e2),mix(sh.y0,sh.ay,e2),2*s,0,Math.PI*2);g.fill();}
     const rr=(10+Math.abs(1-u)*70)*s;g.strokeStyle=`rgba(255,255,255,${Math.abs(1-u)<.12?.9:.35})`;g.lineWidth=2;g.beginPath();g.arc(x,y,rr,0,Math.PI*2);g.stroke();}
   g.save();g.globalCompositeOperation="lighter";for(const p of q.parts){const a=clamp(p.life/p.L,0,1);g.fillStyle=`hsla(${p.h},95%,${55+30*a}%,${a})`;g.beginPath();g.arc(p.x,p.y,p.r*(0.6+.4*a),0,Math.PI*2);g.fill();}g.restore();
   const wy=H*.9;g.fillStyle="rgba(4,6,10,.85)";g.fillRect(0,wy,W,H-wy);drawCatG(g,"rest",0,W/2,H*.99,.42*s,.95);
   for(const f of q.fx)textC(g,f.txt,f.x,f.y,17*s,`rgba(255,240,210,${clamp(f.life,0,1)})`,800);if(q.combo>=2)textC(g,`${q.combo} подряд`,W/2,H*.08,15*s,"#ffd08a",800);},
 down(G,x,y,t){const q=G.st,s=G.s;let best=null,bd=70*s;for(const sh of q.shells){if(sh.done||sh.cx==null)continue;const d=Math.hypot(x-sh.cx,y-sh.cy);if(d<bd){bd=d;best=sh;}}if(!best)return;
   const err=Math.abs((t-best.t0)/best.T-1),kind=err<.1?"perfect":err<.25?"good":"small";best.done=1;const pts={perfect:3,good:2,small:1}[kind];G.score+=pts;q.combo=kind==="perfect"?q.combo+1:0;
   q.fx.push({txt:{perfect:"Тамая-а!",good:"Красиво!",small:"Рано…"}[kind],x:best.cx,y:best.cy-40*s,life:1});burstFw(G,best,kind);if(q.combo>0&&q.combo%5===0){burstFw(G,{cx:G.W/2,cy:G.H*.3,hue:330},"cat");G.score+=5;}},
 stat:G=>`🎆 ${G.score} · ⏱ ${Math.ceil(G.time||0)}`}
);
function newKingyo(G){const W=G.W,H=G.H,s=G.s,r=Math.random(),type=r<.06?"gold":r<.18?"black":r<.35?"white":"red";return{x:rand(W*.15,W*.85),y:rand(H*.25,H*.85),ang:rand(0,6.28),want:0,turn:0,v:rand(30,60)*s,sz:rand(18,32)*s*(type==="black"?1.1:1),type,ph:rand(0,6)};}
function taikoHit(G,k){const q=G.st,t=now();q.hitT=t;q.hitK=k;if(k==="d"){tone(90,.2,"sine",.16);tone(180,.08,"triangle",.05);}else{tone(1300,.04,"square",.035);tone(700,.05,"triangle",.03);}
  let best=null;for(const n of q.notes){if(n.j)continue;if(Math.abs(n.t-t)<.14){best=n;break;}if(n.t-t>.14)break;}if(!best)return;
  const dt=Math.abs(best.t-t);if(best.k!==k){best.j="bad";q.combo=0;q.fx.push({txt:"不可",x:G.W*.18,y:G.H*.28,life:.6,c:"#8a9aa8"});return;}
  best.j=dt<.055?"great":"good";G.score+=best.j==="great"?2:1;q.combo++;q.max=Math.max(q.max,q.combo);q.fx.push({txt:best.j==="great"?"良":"可",x:G.W*.18,y:G.H*.28,life:.6,c:best.j==="great"?"#ffd08a":"#e8e0cc"});}
function burstFw(G,sh,kind){const q=G.st,s=G.s,n={perfect:110,good:70,small:30,fizz:14,cat:0}[kind],sp={perfect:260,good:190,small:110,fizz:50}[kind]*s,h=sh.hue||0;
  if(kind==="cat"){const pts=[];for(let i=0;i<60;i++){const a=i/60*Math.PI*2;pts.push([Math.cos(a),Math.sin(a)*.85]);}for(const sd of [-1,1]){for(let i=0;i<12;i++){const u=i/11;pts.push([sd*(.55+u*.35),-.55-u*.6+(u>.5?(u-.5)*1.2:0)]);}pts.push([sd*.35,-.15],[sd*.3,-.2]);for(let i=0;i<3;i++)pts.push([sd*(.6+i*.18),.15+i*.08]);}
    for(const [dx,dy] of pts)q.parts.push({x:sh.cx,y:sh.cy,vx:dx*150*s,vy:dy*150*s,drag:.93,g:10*s,life:2.4,L:2.4,h:330,r:3*s});}
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+Math.random()*.05,v=sp*(kind==="perfect"&&i%2?.6:1)*(.85+Math.random()*.3);q.parts.push({x:sh.cx,y:sh.cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,drag:.95,g:(kind==="fizz"?120:60)*s,life:kind==="fizz"?.6:rand(1.4,2.2),L:2,h:h+(i%3)*14,r:(kind==="perfect"?2.8:2.2)*s});}
  if(snd.on&&snd.ctx&&kind!=="fizz"){tone(60+Math.random()*30,.6,"sine",.1);setTimeout(()=>{for(let k=0;k<5;k++)setTimeout(()=>tone(3000+Math.random()*2000,.02,"square",.01),k*60);},300);}}
